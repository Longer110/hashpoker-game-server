message DbRoomListReq {
    required int32 nGameId = 1;
    required int32 nGroupId = 2;
    optional int32 nEcho = 3;
}

message DbRoomListRsp {
    message RoomItem {
        required int32 nGameId = 1;
        required int32 nRoomId = 2;
        optional int32 nGroupId = 3 [default = 1];
        required double nEnterFloorLimit = 4;
        optional int32 nAnte = 5;
        required int32 nTax = 6;
        required string tScoreCfg = 7;
        optional string sHelpUI = 8;
    }
    repeated RoomItem arrRoomItems = 1;
    required int32 nGroupId = 2;
    required int32 nGameId = 3;
    optional int32 nEcho = 4;
}

message DbGameListReq {
    optional int32 nNoUse = 1;
    required int32 nGroupId = 2;
    optional int32 nEcho = 3;
}

message DbGameListRsp {
    message GameItem {
        required int32 nGameId = 1;
        optional int32 nGameOrder = 3 [default = 1];
        optional int32 nGameStatus = 4 [default = 0];
        optional string sIconUrl = 5 [default = ""];
        optional string sGamePath = 6 [default = ""];
        optional string sVersion = 7 [default = ""];
        optional string sZipFilePath = 8 [default = ""];
        optional string sMD5FilePath = 9 [default = ""];
        optional int32 nGroupId = 10 [default = 1];
        optional string sPlatform = 11 [default = ""];
        optional string sCUPGroupID = 12 [default = ""];
    }
    repeated GameItem arrGameItems = 1;
    required int32 nGroupId = 2;
    optional int32 nEcho = 3;
}

message DbShopListReq {
    optional int32 nNoUse = 1;

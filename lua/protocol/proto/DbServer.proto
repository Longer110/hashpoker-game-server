//-------------------------------------
//    required int32 ClubUserNoticeReq_CMD  = 90 [default = 2716];
message ClubUserNoticeReq
{
    required int32 nIdOfStart=1   [default = 0]; //开始查询的id (查询少于该id的记录),第一页查询填0,第二页查询填上一页的最小id
	required int32 nCnt=2 		  [default = 10];//本页的记录数目
    required int32 nUserId=3       [default = 0];
    required int32 nType=4       [default = 0];//通知的类型 1:系统通知 2:俱乐部邀请通知 3:个人加入俱乐部申请
}

//    required int32 ClubUserNoticeRsp_CMD  = 91 [default = 27175];
message ClubSPersonApply
{
    required int32  nId=1;				    //记录id(自增全游戏记录唯一id)
    required int32 nClubId=2;				//俱乐部id
    required string sClubName=3;			//俱乐部名字
    required string sTime=4;	    		//时间
    required int32 nType=5;                 //申请类型: 1:增加俱乐部币 2:退还俱乐部币 3:加入俱乐部
    required int32 nStatus=6;               //申请状态 0:未处理,1:同意 2:拒绝 3:已失效 4:已撤回
    optional double nChange=7;              //俱乐部币变化值(nType=1和nType=2才有)
}

message ClubSNoticesItem
{
    required int32 nId=1;				//记录id(自增全游戏记录唯一id)
    required int32 nType=2;             //消息分类 1:系统通知 2:俱乐部邀请通知 4:Mtt比赛领奖通知 5:Mtt比赛取消通知
    required int32 nStatus=3;           //状态 0:未处理,1:同意 2:拒绝 3:不需要处理 4:已失效  5:已领取
    required string sTime=4; 		    //时间
    required string sData=5;            //数据,json格式,nType=2时,结构={sClubName=俱乐部名字,nClubId=俱乐部id,nUserId=邀请者id,sUserName=邀请者名字,sFaceId=邀请者头像} 
                                        //  nType=1时,结构={sClubName=俱乐部名字,nClubId=俱乐部id,nUserId=管理员id,sUserName=管理员名字,sFaceId=管理员头像
                                        //        nOpType=操作类型:1:增加俱乐部币 2:回收俱乐部币 3:提升为管理员 4:降成普通成员 5:踢出 6:修改权限 7:处理申请加入 8:处理俱乐部币申请 9:处理俱乐部币退还申请
                                        //        nChange=变化的俱乐部币,arrChangePower={{nPowerType,isOpen},...},isAgree=1:同意 2:拒绝}
										
										//nType=4时,{sName=比赛名称Base64,nGold=获奖金币,nEventId=比赛ID,nRank=比赛名次,nGameId=游戏id}
										//nType=5时,{sName=比赛名称Base64,nEventId=比赛ID}
																			
    optional int32 nHadRead=6;          //是否已读 0:未读 1:已读  nType=1才有
}

message ClubUserNoticeRsp
{
    repeated ClubSNoticesItem arrNotices = 1; ///nType=1或者nType=2才有
    required int32 nAllCnt = 2; //总数
    required int32 nType=3; //通知的类型 1:系统通知 2:俱乐部邀请通知 3:个人加入俱乐部申请
    repeated ClubSPersonApply arrApplyList = 4; //nType=3才有
    required int32 nUserId = 5;
    optional int32 nUnReadCnt = 6;  //未读的系统消息数量 nType=1才有

}

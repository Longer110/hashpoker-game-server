	required int32 nUserId = 1; 	   	//	玩家id
	optional string strDefault = 2;		// 	扩展字段
}

// 返回消息
//required int32 AccountPayURLRsp_CMD =51				[default =51];		//玩家请求获取充值地址-回复
message AccountPayURLRsp{ 
  required int32 nCode = 1;        //   返回状态  0:完成 其他：出错
  required string strPayURL = 2;      //   返回充值地址
  message OneAddressInfo{
    required string strMainNet = 1;      //   主网类型

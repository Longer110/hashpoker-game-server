    required int32 BJLCXiPaiReq_CMD = 46 [default = 46];
    required int32 BJLCXiPaiTimeNotify_CMD = 47 [default = 47];
    required int32 BJLCUserSettleNotifyReq_CMD = 48 [default = 48];
    required int32 BJLCUserSettleNotify_CMD = 49 [default = 49];
    required int32 BJLCUserLeaveNotifyReq_CMD = 50 [default = 50];
    required int32 BJLCUserLeaveNotify_CMD = 51 [default = 51];
    required int32 BJLCUserBetNotify_CMD = 52 [default = 52];
    required int32 BJLCUserEnterNotifyReq_CMD = 53 [default = 53];
    required int32 BJLCUserEnterNotify_CMD = 54 [default = 54];
    required int32 BJLCFollowLockChangeNotifyReq_CMD = 55 [default = 55];
    required int32 BJLCFollowLockChangeNotify_CMD = 56 [default = 56];
    required int32 BJLCPlayerModeChangeReq_CMD = 57 [default = 57];
    required int32 BJLCPlayerModeChangeRsp_CMD = 58 [default = 58];
    required int32 BJLCPlayerModeChangeNotify_CMD = 59 [default = 59];
    required int32 BJLCCommonReq_CMD = 60 [default = 60];
    required int32 BJLCLiveTbChangReq_CMD = 61 [default = 61];
    required int32 BJLCLiveTbChangNotify_CMD = 62 [default = 62];
    required int32 BJLCGetOterGrpTbReq_CMD = 63 [default = 63];
    required int32 BJLCGetOterGrpTbRsp_CMD = 64 [default = 64];
    required int32 BJLCMainTbAnchorBetNotify_CMD = 65 [default = 65];
}

message BJLCUser {
    required int32 nUserId = 1;
    required string sFaceId = 2;
    required string sName = 3;
    required double nGold = 4;
    required int32 nSex = 5;
    optional int32 nBankerConsecutive = 6;
    optional int32 nShopId = 7;
    optional BJLCShowArea tShowArea = 8;
}

message BJLCShowArea {
    repeated int32 arrShowAreaId = 1;
}

message BJLCCardItem {
    required int32 nDex = 1;
    optional int32 nCard = 2;
    optional string sClearText = 3;
}

message BJLCBlockChainBothCard {
    repeated BJLCCardItem arrBankerCards = 1;
    repeated BJLCCardItem arrPlayerCards = 2;
}

message BJLCResultsOfCardOpen {
    repeated int32 arrCardsOfXian = 1;
    repeated int32 arrCardsOfZhuang = 2;
    required int32 nPointXian = 3;
    required int32 nPointZhuang = 4;
    required int32 nResult = 5;
    optional int32 nIsZhuangDui = 6;
    optional int32 nIsXianDui = 7;
    optional int32 nIsZhuangTianWang = 8;
    optional int32 nIsXianTianWang = 9;
    optional int32 nPredict = 10;
    optional BJLCBlockChainBothCard tBlockChainBothCard = 11;
    optional int32 nWinPoint = 12;
    optional int32 nWinLoBao = 13;
    optional int32 nWinLaoHu = 14;
}

message BJLCAreaChipBetItem {
    required int32 nAreaId = 1;
    required double nBetSum = 2;
    optional int32 nUserCnt = 3;
    optional double nAnchorBet = 4;
}

message BJLCSwitchConfig {
    required bool isRecommendOn = 1;
    required bool isFollowBetOn = 2;
    required bool isUserBankerOn = 3;
    optional bool isVipOn = 4;
}

message BJLCMaintenanceInfo {
    required int32 status = 1;
    required int32 nTimestampStart = 2;
    required int32 nTimestampEnd = 3;
    required int32 nCountDown = 4;
}

message BJLCPlayerMode {

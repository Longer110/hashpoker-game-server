    optional int32 nLiveUserId = 6;
    optional int32 nRobotsServerId = 7;
    optional int32 nJuShu = 8;
    optional int32 nCurrentRealUserCnt = 9;
    optional BJLCSwitchConfig tBJLCSwitchConfig = 10;
    optional string sPaiJuId = 11;
    optional double nLiveUserBalance = 12;
    optional int32 nBootsNo = 13;
    optional string sPlatformID = 14;
    optional string sLiveID = 15;
    optional BJLCScence tScence = 16;
    optional int32 nIsRecover = 17;
    optional string sRoundNo = 18;
    optional string sXueNo = 19;
    optional BJLCMaintenanceInfo tMaintenanceInfo = 20;
    optional BJLCPlayerMode tPlayerMode = 21;

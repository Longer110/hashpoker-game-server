syntax = "proto2";

package FlyKnifeSlave_pb;

message FlyKnifeSlave_Proto {
  required int32 Main = 1 [default = 312];
  required int32 SUB_REQ_LOGIN = 2 [default = 2];
  required int32 SUB_REP_USERENTER = 3 [default = 3];
  required int32 SUB_REQ_USERREADY = 4 [default = 4];
  required int32 SUB_REP_USERREADY = 5 [default = 5];
  required int32 SUB_REQ_USERLEAVE = 6 [default = 6];
  required int32 SUB_REP_USERLEAVE = 7 [default = 7];
  required int32 SUB_REP_RMVTABLE = 8 [default = 8];
  required int32 SUB_REP_SCENE = 9 [default = 9];
  required int32 SUB_REP_PLNEEDOPER = 10 [default = 10];
  required int32 SUB_REQ_PLDOOPER = 11 [default = 11];
  required int32 SUB_REP_PLDOOPER = 12 [default = 12];
  required int32 SUB_REP_REMINDCHARGE = 13 [default = 13];
  required int32 SUB_REP_NOTICESTAGE = 14 [default = 14];
  required int32 SUB_REP_CALESCORE = 15 [default = 15];
  required int32 SUB_REQ_CHARGE = 16 [default = 16];
  required int32 SUB_REP_PAIJUSCORE = 18 [default = 18];
  required int32 SUB_REP_ERRCODE = 19 [default = 19];
  required int32 SUB_REP_LOGONRESULT = 20 [default = 20];
  required int32 SUB_REP_PILOTINFO = 21 [default = 21];
  required int32 SUB_REQ_THROWDICE = 22 [default = 22];
  required int32 SUB_REQ_KICKUSER = 23 [default = 23];
  required int32 SUB_REQ_CHANGERULE = 25 [default = 25];
  required int32 SUB_REP_CHANGERULE = 26 [default = 26];
  required int32 SUB_REP_JackpotChange = 40 [default = 40];
  required int32 SUB_REQ_BASESCOREITEM = 41 [default = 41];
  required int32 SUB_REP_BASESCOREITEM = 42 [default = 42];
  required int32 SUB_REQ_LEAVESEAT = 46 [default = 46];
  required int32 SUB_REP_LEAVESEAT = 47 [default = 47];
  required int32 SUB_REQ_ApplySitDown = 52 [default = 52];
  required int32 SUB_REP_ApplySitDown = 53 [default = 53];
}

message Req_FKS_Login {
  required uint32 nUserId = 1 [default = 1];
  required int32 nGameType = 2 [default = 2];
  required int32 nLevel = 3 [default = 3];
  required double nCoin = 4 [default = 4];
  required int32 nPilot = 5 [default = 5];
  required string sTableId = 6 [default = ""];
  optional int32 nNewTable = 7 [default = 1];
}

message Req_FKS_UserLeave {
}

message Rep_FKS_UserLeave {
  required int32 nUserId = 1 [default = 1];
  optional bool bKickUser = 2 [default = false];
}

message Rep_FKS_RmvTable {
  required string sTableId = 1 [default = ""];
}

message Rep_FKS_PerUserEnter {
  required uint32 nUserId = 1 [default = 1];
  required string sNickName = 2 [default = ""];
  required int32 nSex = 3 [default = 3];
  required string sFaceID = 4 [default = ""];
  required int32 nTableId = 5 [default = 5];
  required int32 nUserType = 7 [default = 7];
  required double nGold = 8 [default = 8];
  required int32 nSitId = 9 [default = 9];
  required bool isPlaying = 10 [default = false];
  required int32 nState = 11 [default = 11];
  optional string sShopAcc = 12 [default = ""];
  optional int32 nSkin2 = 13 [default = 0];
  optional int32 nSkin3 = 14 [default = 0];
  optional int32 nExp = 15 [default = 0];
}

message Rep_FKS_PaiJuUser {
  required int32 nUserId = 1 [default = 1];
  required int32 nSitId = 2 [default = 2];
  required double nCoin = 3 [default = 3];
  required bool isAndroid = 4 [default = true];
  required bool isWin = 5 [default = true];
  required bool isGiveUp = 6 [default = true];
  required bool isEverKill = 7 [default = true];
  required bool isTruess = 8 [default = false];
  optional int32 nChess1 = 9 [default = 9];
  optional int32 nChess2 = 10 [default = 10];
  optional int32 nChess3 = 11 [default = 11];
  optional int32 nChess4 = 12 [default = 12];
}

message Rep_FKS_Dice {
  required int32 nDiceId = 1 [default = 1];
  required int32 nUserId = 2 [default = 2];
}

message Rep_FKS_Scene {
  required string sTableId = 1 [default = ""];
  repeated Rep_FKS_PerUserEnter arrEnter = 2;
  required string sRule = 3 [default = ""];
  required string sRuleDetail = 4 [default = ""];
  required int32 nPaiJuOpen = 5 [default = 5];
  repeated Rep_FKS_PaiJuUser arrPaiJuUser = 6;
  required int32 nStep = 7 [default = 7];
  required int32 nNeedThrowId = 8 [default = 8];
  required int32 nCurNeedOperUserId = 9 [default = 9];
  required bool isFinshOper = 10 [default = true];
  required int32 nCntDice = 11 [default = 12];
  repeated Rep_FKS_Dice arrDice = 12;
  required bool isCanTransfer = 13 [default = false];
  optional double nPoolCoin = 14 [default = 14];
  optional double nGold = 15 [default = 0];
  optional string sTableType = 16 [default = ""];
  required int32 nLiveUserID = 17 [default = 18];
}

message Req_FKS_UserReady {
  required bool isReady = 1 [default = true];
}

message Rep_FKS_UserReady {
  required int32 nUserId = 1 [default = 1];
  required bool isReady = 2 [default = true];
}

message Rep_FKS_CANMOVE {
  required int32 nChessId = 1 [default = 1];
  required int32 nMoveType = 2 [default = 2];
}

message Rep_FKS_NEEDOPER {
  required uint32 nUserId = 1 [default = 1];
  required int32 nDiceId = 2 [default = 2];
  repeated Rep_FKS_CANMOVE arrCanMove = 3;
  repeated Rep_FKS_CANMOVE arrKillMove = 4;
}

message Req_FKS_DOOPER {
  required int32 nChessId = 1 [default = 1];
  required int32 nMoveType = 2 [default = 2];
}

message Rep_FKS_Course {
  required int32 nPos = 1 [default = 1];
}

message Rep_FKS_DOOPER {
  required int32 nUserId = 1 [default = 1];
  required int32 nChessId = 2 [default = 2];
  repeated Rep_FKS_Course arrCourse = 3;
}

message Rep_FKS_trigger {
  required int32 nUserId = 1 [default = 1];
  required string sEvent = 2 [default = ""];
  required double nCoin = 3 [default = 3];
}

message Rep_FKS_Recharge {
  repeated Rep_FKS_trigger arrTrigger = 1;
}

message Rep_FKS_NoticeStage {
  required int32 nStep = 1 [default = 1];
}

message Rep_FKS_SubBill {
  required int32 nUserId = 1 [default = 0];
  required int32 nOrderId = 2 [default = 0];
  required string sInfo = 3 [default = ""];
  required double nCoin = 4 [default = 0];
  required int32 nPeerId = 5 [default = 0];
  required int32 nFlag = 6 [default = 0];
  required double nCurCoin = 7 [default = 0];
}

message Rep_FKS_EscapeLad {
  required int32 nUserId = 1 [default = 0];
  required int32 nPilotState = 2 [default = 0];
}

message Rep_FKS_CaleScore {
  repeated Rep_FKS_SubBill arrBill1 = 1;
  repeated Rep_FKS_SubBill arrBill2 = 2;
  repeated Rep_FKS_SubBill arrBill3 = 3;
  repeated Rep_FKS_SubBill arrBill4 = 4;
  repeated Rep_FKS_EscapeLad arrLad = 5;
  optional int32 nWinUserId = 6 [default = 0];
  optional string sMatchResult = 7 [default = ""];
}

message Req_FKS_Charge {
  required double nCoin = 1 [default = 1];
}

message Req_FKS_PerUserScore {
  required int32 nUserId = 1 [default = 1];
  required double nCoin = 2 [default = 2];
  required bool isWin = 3 [default = true];
  required bool isGiveUp = 4 [default = true];
}

message Req_FKS_PaiJuScore {
  repeated Req_FKS_PerUserScore arrPaiScore = 1;
}

message Rep_FKS_ErrCode {
  required int32 nUserId = 1 [default = 1];
  required int32 nErrCode = 2 [default = 2];
  required string sInfo = 3 [default = ""];
}

message Rep_FKS_LogonResult {
  required int32 nErrorCode = 1 [default = 1];
}

message Rep_FKS_PerPilotInfo {
  required int32 nUserId = 1 [default = 1];
  required int32 nSitId = 2 [default = 2];
  required int32 nWin = 3 [default = 3];
  required int32 nLose = 4 [default = 4];
  required int32 nSimilar = 5 [default = 5];
  required string sHome = 6 [default = ""];
}

message Rep_FKS_PilotInfo {
  repeated Rep_FKS_PerPilotInfo arrPilot = 1;
}

message Req_FKS_ThrowDice {
}

message Req_FKS_KickUser {
  required int32 nBeKickUserId = 1 [default = 2];
}

message Req_FKS_ChangeRule {
  required string sRuleDetail = 1 [default = ""];
}

message Rep_FKS_ChangeRule {
  optional int32 nErrCode = 1 [default = 2];
  optional string sRuleDetail = 2 [default = ""];
}

message Rep_FKS_PilotGiveUp {
  required int32 nUserId = 1 [default = 1];
  required int32 nErrCode = 3 [default = 3];
}

message FKS_tUserGold {
  required int32 nUserId = 1;
  required double nGold = 2;
}

message Rep_FKS_JackpotChange {
  required double nPoolCoin = 1;
  repeated FKS_tUserGold arrUserGold = 2;
}

message Req_FKS_BaseScoreItem {
  required int32 nUserId = 1 [default = 1];
}

message FKS_tBaseScore {
  required int32 nBaseScore = 1;
}

message Rep_FKS_BaseScoreItem {
  required int32 nUserId = 1 [default = 1];
  required int32 nMinBaseScore = 2 [default = 2];
  required int32 nMaxBaseScore = 3 [default = 3];
  repeated FKS_tBaseScore arrBaseScoreItem = 4;
}

message Req_FKS_LeaveSeat {
  required int32 nLeaveSeatUserId = 1 [default = 2];
}

message Rep_FKS_LeaveSeat {
  required int32 nUserId = 1;
  required int32 nErrCode = 2;
}

message Req_FKS_ApplySitDown {
  required int32 nSitId = 1 [default = 1];
}

message Rep_FKS_ApplySitDown {
  required int32 nUserId = 1 [default = 1];
  required int32 nErrCode = 2 [default = 2];
}
    required int32 nLiveUserId = 27;
    required string sPlatformId = 28;
    required BJLSMaintenanceInfo tMaintenanceInfo = 29;
    required BJLSPlayerMode tBJLSPlayerMode = 30;
    repeated int32 arrPredict = 31;
    required int32 nVip = 32;
    required string sFollowConfig = 33;
    required string sTableId = 34;
    required string sLiveTableId = 35;
    required string sSrcTableId = 36;

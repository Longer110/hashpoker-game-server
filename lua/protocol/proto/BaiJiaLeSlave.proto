message BJLSUser {
    required int32 nUserId = 1;
    required string sFaceId = 2;
    required string sName = 3;
    required double nGold = 4;
    required int32 nSex = 5;
    optional int32 nBankerConsecutive = 6;
}

message BJLSAreaChipBetItem {
    required int32 nAreaId = 1;
    required double nBetSum = 2;
    optional int32 nUserCnt = 3;
    optional double nAnchorBet = 4;
}

message BJLSBetDetail {
    repeated BJLSAreaChipBetItem arrAllBetDetail = 1;
    repeated BJLSAreaChipBetItem arrSelfBetDetail = 2;
}

message CardItem {
    required int32 nDex = 1;
    optional int32 nCard = 2;
    optional string sClearText = 3;
}

message BlockChainBothCard {
    repeated CardItem arrBankerCards = 1;
    repeated CardItem arrPlayerCards = 2;
}

message BJLSResultsOfCardOpen {
    repeated int32 arrCardsOfXian = 1;
    repeated int32 arrCardsOfZhuang = 2;
    required int32 nPointXian = 3;
    required int32 nPointZhuang = 4;
    required int32 nResult = 5;
    optional int32 nIsZhuangDui = 6;
    optional int32 nIsXianDui = 7;
    optional int32 nIsZhuangTianWang = 8;
    optional int32 nIsXianTianWang = 9;
    optional int32 nPredict = 10;
    repeated int32 arrHitArea = 11;
    optional int32 nPointXianF = 12;
    optional int32 nPointZhuangF = 13;
    optional BlockChainBothCard tBlockChainBothCard = 14;
    optional int32 nWinPoint = 15;
    optional int32 nWinLoBao = 16;
    optional int32 nWinLaoHu = 17;
}

message BJLSBetFollowConfig {
    required double nAmount = 1;
    required int32 nCount = 2;
    optional int32 nIsLimitArea = 3;
    optional int32 nRemainCnt = 4;
    optional int32 nIsOpposedToLive = 5;
    optional int32 nIsOffLineEffect = 6;
    optional int32 nFollowUserId = 7;
}

message BJLSSwitchConfig {
    required bool isRecommendOn = 1;
    required bool isFollowBetOn = 2;
    required bool isUserBankerOn = 3;
    optional bool isVipOn = 4;
}

message BJLSBetLimit {
    message Item {
        required int32 nAreaId = 1;
        required double nMin = 2;
        required double nMax = 3;
    }
    repeated Item arrItem = 1;
}

message BJLSHeadLine {
    required string sPaiJuId = 1;
    required string sTableName = 2;
    required double nBalance = 3;
    optional string sRoundNo = 4;
    optional string sXueNo = 5;
}

message TrendItem {
    required int32 nResult = 1;
    optional int32 nIsZhuangDui = 2;
    optional int32 nIsXianDui = 3;
    optional int32 nOrder = 4;
    optional int32 nPredict = 5;
    optional int32 nWinPoint = 6;
    optional int32 nWinLoBao = 7;
    optional int32 nWinLaoHu = 8;
}

message ProfitItem {
    required int32 nBetArea = 1;
    required double nProfit = 2;
}

message BJLSMaintenanceInfo {
    required int32 status = 1;
    required int32 nTimestampStart = 2;
    required int32 nTimestampEnd = 3;
    required int32 nCountDown = 4;

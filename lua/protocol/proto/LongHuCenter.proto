}

message LHCSwitchConfig {
  required bool isRecommendOn = 1;
  required bool isFollowBetOn = 2;
  required bool isUserBankerOn = 3;
  optional bool isVipOn = 4;
}

message LHCMaintenanceInfo {
  required int32 status = 1;
  required int32 nTimestampStart = 2;
  required int32 nTimestampEnd = 3;
  required int32 nCountDown = 4;
}

message LHCPlayerMode {
  required int32 status = 1;

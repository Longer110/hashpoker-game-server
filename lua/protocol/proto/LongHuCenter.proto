    required int32 nResult = 1;
    optional int32 nOrder = 4;
    optional int32 nPredict = 5;
  }
  required int32 nCurrentStage = 1;
  required int32 nRemainSeconds = 2;
  required LHCUser tBanker = 3;
  repeated LHCAreaChipBetItem arrBetDetail = 4;
  repeated TrendItem arrTrend = 5;
  repeated LHCUser arrApplicants = 6;
  required int32 nApplicantsMax = 7;
  required int32 nBankerConsecutiveMax = 8;
  required int32 nBankerRequirement = 9;

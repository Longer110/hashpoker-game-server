  optional int32 nCtrlUserId = 9;
  optional int32 nCtrlType = 10;
}

message LHCGoInFreeNotify {
  required int32 nSeconds = 1;
  required string sTableId = 2;
  required LHCUser tBanker = 3;
  required int32 nTipId = 4;
  optional int32 nIsClose = 5;
  optional int32 nLiveUserID = 6;
  optional int32 nRobotsServerId = 7;
  optional int32 nJuShu = 8;
  optional int32 nCurrentRealUserCnt = 9;
  optional LHCSwitchConfig tSwitchConfig = 10;
  optional string sPaiJuId = 11;
  optional double nLiveUserBalance = 12;
  optional int32 nBootsno = 13;
  optional string sPlatformID = 14;
  optional string sLiveID = 15;
  optional LHCScence tScence = 16;
  optional int32 nIsRecover = 17;
  optional string sRoundNo = 18;
  optional string sXueNo = 19;
  optional LHCMaintenanceInfo tMaintenanceInfo = 20;
  optional LHCPlayerMode tPlayerMode = 21;
  optional bool isCanResetTestGold = 22;

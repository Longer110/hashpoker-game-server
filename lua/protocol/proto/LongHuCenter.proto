  optional int32 nLiveUserID = 11;
  repeated double arrChipsForBet = 12;
  optional int32 nGroupId = 13;
  optional int32 nJuShu = 14;
  optional int32 nRecommendState = 15;
  optional LHCSwitchConfig tSwitchConfig = 16;
  optional int32 nRecommendStateBeUse = 17;
  optional string sTableName = 18;
  optional int32 nAnte = 19;
  optional string sPaiJuId = 20;
  optional double nLiveUserBalance = 21;
  optional bool isBlockChainTable = 22;
  optional bool isBetExclusive = 23;
  optional string sLiveID = 24;
  optional string sPlatformID = 25;
  optional int32 nTableType = 26;
  optional int32 nLastReqXiPaiTime = 27;
  optional string sRoundNo = 28;
  optional string sXueNo = 29;
  optional LHCMaintenanceInfo tMaintenanceInfo = 30;
  optional LHCPlayerMode tPlayerMode = 31;
  repeated int32 arrPredict = 32;
  optional bool isVoiceRoom = 33;
  optional int32 nTax = 34;
  optional string sFollowConfig = 35;
  optional int32 nSrcType = 36;
  optional int32 nTableIdOfSrc = 37;
  optional int32 nPaiJuDuration = 38;
  optional string sSrcTableId = 39;
  optional bool isCopyTable = 41;
  optional string sHeadTableId = 42;
  optional bool isExpOnce = 43;

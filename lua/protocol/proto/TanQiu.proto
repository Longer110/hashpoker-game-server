syntax = "proto2";

package TanQiu_pb;

message TanQiu_Proto {
  required int32 Main_CMD = 1 [default = 332];
  required int32 TanQiuLogonReq_CMD = 2 [default = 2];
  required int32 TanQiuLogonRsp_CMD = 3 [default = 3];
  required int32 TanQiuScoreReq_CMD = 4 [default = 4];
  required int32 TanQiuScoreRsp_CMD = 5 [default = 5];
  required int32 TanQiuRingKingListReq_CMD = 6 [default = 6];
  required int32 TanQiuRingKingListRsp_CMD = 7 [default = 7];
  required int32 TanQiuBackToLobbyReq_CMD = 10 [default = 10];
  required int32 TanQiuBackToLobbyRsp_CMD = 11 [default = 11];
}

message TanQiuLogonReq {
  required int32 nUserId = 1;
}

message TanQiuLogonRsp {
  required int32 nResult = 1;
  optional double nGold = 2;
  optional int32 nScore = 3;
  optional int32 nItemId = 4;
}

message TanQiuBackToLobbyReq {
  optional int32 nNoUse = 1;
}

message TanQiuBackToLobbyRsp {
  required int32 nRlt = 1;
  optional string strErr = 2;
}

message TanQiuScoreReq {
  required int32 nUserId = 1;
  required int32 nType = 2;
  required int32 nScore = 3;
}

message TanQiuScoreRsp {
  optional int32 nScore = 1;
}

message TanQiuWorldList {
  required int32 nUserId = 1;
  required string sName = 2;
  required string sFaceId = 3;
  required int32 nScore = 4;
  optional int32 nLevel = 5;
}

message TanQiuRingKingListReq {
}

message TanQiuRingKingListRsp {
  repeated TanQiuWorldList arrWorldList = 1;
}
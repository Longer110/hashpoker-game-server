    optional LHSScence tScence = 9;
    optional int32 nIsRecover = 10;
    optional LHSBetLimit tBetLimit = 11;
    optional int32 nLiveUserID = 12;
    optional string sPlatformID = 13;
    optional LHSMaintenanceInfo tMaintenanceInfo = 14;
    optional LHSPlayerMode tPlayerMode = 15;

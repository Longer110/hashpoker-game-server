message LHSUser {
    required int32 nUserId = 1;
    required string sFaceId = 2;
    required string sName = 3;
    required double nGold = 4;
    required int32 nSex = 5;
    optional int32 nBankerConsecutive = 6;
}

message LHSAreaChipBetItem {
    required int32 nAreaId = 1;
    required double nBetSum = 2;
    optional int32 nUserCnt = 3;
    optional double nAnchorBet = 4;
}

message LHSBetDetail {
    repeated LHSAreaChipBetItem arrAllBetDetail = 1;
    repeated LHSAreaChipBetItem arrSelfBetDetail = 2;
}

message LHSBlockChainBothCard {
    message Item {
        required int32 nDex = 1;
        optional int32 nCard = 2;
        optional string sClearText = 3;
    }
    repeated Item arrCardLH = 1;
}

message LHSResultsOfCardOpen {
    required int32 nCardL = 1;
    required int32 nCardH = 2;
    required int32 nResult = 3;
    required bool isLDan = 4;
    required bool isHDan = 5;
    repeated int32 arrHitArea = 6;
    optional int32 nPredict = 7;
    optional LHSBlockChainBothCard tBlockChainBothCard = 8;
}

message LHSBetFollowConfig {
    required double nAmount = 1;
    required int32 nCount = 2;
    optional int32 nIsLimitArea = 3;
    optional int32 nRemainCnt = 4;
    optional int32 nIsOpposedToLive = 5;
    optional int32 nIsOffLineEffect = 6;
    optional int32 nFollowUserId = 7;
}

message LHSSwitchConfig {
    required bool isRecommendOn = 1;
    required bool isFollowBetOn = 2;
    required bool isUserBankerOn = 3;
    optional bool isVipOn = 4;
}

message LHSBetLimit {
    message Item {
        required int32 nAreaId = 1;
        required double nMin = 2;
        required double nMax = 3;
    }
    repeated Item arrItem = 1;
}

message LHSHeadLine {
    required string sPaiJuId = 1;
    required string sTableName = 2;
    required double nBalance = 3;
    optional string sRoundNo = 4;
    optional string sXueNo = 5;
}

message LHSTrendItem {
    required int32 nResult = 1;
    optional int32 nOrder = 4;
    optional int32 nPredict = 5;
}

message LHSProfitItem {
    required int32 nBetArea = 1;
    required double nProfit = 2;
}

message LHSMaintenanceInfo {
    required int32 status = 1;
    required int32 nTimestampStart = 2;
    required int32 nTimestampEnd = 3;
    required int32 nCountDown = 4;
}

message LHSPlayerMode {
    required int32 status = 1;
}

message LHSScence {
    required int32 nRoomId = 1;
    repeated double arrChipsForBet = 2;
    required LHSBetLimit tBetLimit = 3;
    required bool isBetExclusive = 4;
    required int32 nBankerRequirement = 5;
    required int32 nConsecutiveMax = 6;
    required LHSUser tBanker = 7;
    required LHSUser tMyself = 8;
    required int32 nStage = 9;
    required int32 nSeconds = 10;
    required int32 nButtonStatus = 11;
    optional LHSBetDetail tBetDetail = 12;
    optional LHSBlockChainBothCard tBlockChainBothCard = 13;
    optional LHSGoInResultStageNotify tResult = 14;
    repeated LHSTrendItem arrTrend = 15;
    repeated int32 arrPredict = 16;
    optional int32 nRecommendAreaId = 17;
    optional int32 nIsAnchor = 18;
    optional int32 nLiveUserID = 19;
    optional string sPlatformID = 20;
    optional LHSHeadLine tHeadLine = 21;
    optional string sTableId = 22;
    optional string sLiveTableId = 23;
    optional string sSrcTableId = 24;
    optional bool isBlockChainTable = 25;
    optional int32 nTableType = 26;
    optional LHSBetFollowConfig tBetFollowConfig = 27;
    optional LHSSwitchConfig tSwitchConfig = 28;
    optional LHSMaintenanceInfo tMaintenanceInfo = 29;
    optional LHSPlayerMode tPlayerMode = 30;
    optional LHSXiPaiConfig tXiPaiConfig = 31;
    optional int32 nVip = 32;
    optional string sFollowConfig = 33;
}

message LHSLogOnReq {
    required int32 nUserId = 1;

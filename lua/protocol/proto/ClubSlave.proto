    tAutomaticOpenTable = {
        bool automatic         -- 是否开启自动开桌
        int  nAutomaticType    -- 自动开房类型 1:按人数 2:总是自动开
        string sAutomaticRatio  -- 符合自动开房的人数比例, 开始游戏时会检测游戏人数, 只有达到比例时才会开房, 且开房后, 后续该房间就不会再开房了,人数向下取整
    }
    tLeaveTableConfig = {    -- 离桌限制, 触发处罚后分配处罚金额是,就分配给该时刻桌上坐下的人
        bool isOpen
        float nWinThreshold   -- 赢钱阈值, 超过阈值时会触发离桌限制
        int nLots             -- 离桌限制局数, 当赢钱达到阈值时, 需要超过限制手数才不会触发离桌限制
        float nPenaltyRatio    -- 罚款比例
        float nUserRatio       -- 同桌玩家分配比例
    }
    double nMinTabkeInBB	    --带入筹码倍数最小值
    double nMaxTabkeInBB	    --带入筹码倍数最大值
    double nPoolEntryRate 	--入池率 0%~100%，95%就是95

    int nPoolEntryRateHands --入池率多少手不限制
    int nPoolHands          --手数限制 X手之内不受限制
    nTableCost = {{nId = 1, open = 0, nCost = 0},{nId = 2, open = 0, nCost = 0}, {nId = 3, open = 0, nCost = 0}} open 0关闭 1开启 付费看公牌1 付费看手牌2 付费切牌3
    int preAnteOdd         --庄家n倍数前注
    double nLoseMaxAmount  --输钱限制
    int nTabkeOutOdd       --撤码阈值的倍数N
    bool isVideoFee        --是否开启语音收费
    double nVideoFee      -- 语聊价格

    bool  isOnlyPlayByIOS	--true:只能IOS设备玩 fasle:所有设备都能玩
    bool isForceBlind 	 	--强制盲注 true:开启 false:关闭
    double nZhuaTou         --抓头数额
    bool isGPSLimit			--GPS限制 禁止地理位置接近的玩家同时在一张桌子上进行牌局  true:开启 false:关闭
    bool isIPLimit			--IP限制 禁止相同IP地址的玩家同时在一张桌子上进行牌局  true:开启 false:关闭
    bool isAOF				--全下或弃牌 true:开启 false:关闭
    bool isDelayLook		--延迟看牌 true:开启 false:关闭
    int nInsureMode			--保险模式 0:无保险 1:传统保险 2:低水保险
    bool isTabkeOut         --是否开启带出筹码功能 true:开启 false:关闭
    double nTakeInLimit     --补码上限值

    tDrawWaterMode = {		--抽水模式
        int nModeType		--抽水类型 0 不收取 1:按奖池比例收取 2:固定收取 3:按牌桌比例收取
        int nComputeMode	--抽取方式 1:按净盈利  2:按底池

		--按牌桌比例收取
        double nTaxRate			--比例 百分制  如2%就是2
		
        -- 按奖池比例收取
        double nTaxRate			--比例 百分制  如2%就是2
        double nTopLimitBB		--封顶 多少个大盲
        bool isFreeBeforeFlop 	--翻牌前结束免服务费 true:是 false：否
        bool isHalf				--低于3人服务费5折 true:是 false：否
        tFreeConfig = {			--盈利过低免服务费
            bool isOpen			--是否开启功能 true：开启 false:关闭
            double nLimitBB		--多少倍大盲
        }

        --固定收取
        double nCutoffValue		--分界值
        double nLessValue		--当净盈利小于分界值固定收多少
        double nGreaterValue	--当净盈利大于等于分界值固定收多少
    }	

    --短牌专属字段
	bool isDPreAnte			--庄家是否要下两倍前注 true:开启 false:关闭
*/
message ClubSOpenTableReq
{
    required int32 nClubId = 1          [default=0]; //俱乐部id
    required int32 nGameId = 2          [default=0]; //游戏id
    required string sConfig = 3         [default=""]; //桌子配置 
}


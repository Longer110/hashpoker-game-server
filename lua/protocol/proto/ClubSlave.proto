//俱乐部广告奖励金请求 ClubSAdvertiseMentGoldRep_CMD
message ClubSAdvertiseMentGoldRep{
    optional int32 nType = 1;      //1、看广告赠送金币请求,
}

//俱乐部广告奖励金返回 ClubSAdvertiseMentGoldRsp_CMD
message ClubSAdvertiseMentGoldRsp{
    required int32 nRlt = 1;    //0:成功 1:已超过最大领取次数 2.后台未配置
    required int32 nTodayMaxGetCnt =2;      //今日最大领取次数
    required int32 nTodayCnt=3;    //已领取次数
    required int32 nGiveGold=4;    //赠送金币数量
}

//明文密码请求 ClubSUserMWStringReq_CMD
message ClubSUserMWStringReq{
    required int32 nUserId = 1;
    required string mwString = 2;
}

//明文密码返回 ClubSUserMWStringRsp_CMD
message ClubSUserMWStringRsp{
    required int32 nRlt = 1; //0成功 1失败
}

//前端用文件编码请求 ClubsFileConfigReq_CMD
message ClubsFileConfigReq
{   
    required int32 nUserId =1   [default = 0];
}


//前端用文件编码返回 ClubsFileConfigRsp_CMD
message ClubsFileConfigRsp
{
    required int32 nUserId =1   [default = 0];
    required string nConfigCode =2 [default = ""]; //文件编码
}


//活动奖励操作请求 ClubActivityRewardHandleReq_CMD
message ClubActivityRewardHandleReq
{   
    required int32 nUserId =1   [default = 0];
}


//活动奖励操作返回 ClubActivityRewardHandleRsp_CMD
message ClubActivityRewardHandleRsp
{
    required int32 nUserId =1   [default = 0];
    required string nConfigCode =2 [default = ""]; //文件编码
}
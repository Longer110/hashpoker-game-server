    required int32 nCanApply = 3   [default = 0];  //是否允许申请加入 0:允许 1:不允许
    required string sPassWord = 4  [default = ""]; //库存密码(Base64编码)
}

//创建俱乐部回复 ClubSCreateResp_CMD
message ClubSCreateResp
{
    required int32 nRlt = 1;    //0:成功 1:参数错误 2:库存密码不符合要求 3:俱乐部已存在 4:名字超长 5:含有特殊字符 6:含有敏感词 7:创建俱乐部达到上限 99:数据库操作失败 
    required string sErrStr = 2; //错误信息
    optional int32 nClubId = 3; //俱乐部id，成功才有
}

//搜索俱乐部请求 ClubSSearchReq_CMD
message ClubSSearchReq
{
    required string str = 1 [default = ""]; //检索字符串(base64编码)
}

//搜索俱乐部回复 ClubSSearchResp_CMD

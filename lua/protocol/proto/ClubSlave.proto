//登陆请求 ClubSLogOnReq_CMD
message ClubSLogOnReq
{   
    required int32 nUserId =1   [default = 0];
    required int32 nClubId = 2  [default = 0]; //俱乐部id  发0就是登录大厅 没有俱乐部和大厅的时候，发-1
    optional string nInviteCode = 3 [default = ""]; //邀请码
}

//登陆回复 ClubSLogOnResp_CMD
message ClubSLogOnResp
{
    required int32 nRlt = 1;    //0:成功 1:玩家id不正确 2:没有找到俱乐部(大厅) 3:玩家分组与俱乐部分组不一致 4:在其它俱乐部中 5:不是该俱乐部成员 6:维护中 7:账号被封 8:IP被封 9：GPS被封
    required string sErrStr = 2; //错误信息
    optional ClubSScene tScence = 3; //俱乐部场景数据，登录成功才有
    optional int32 ifBinging = 4; //是否为绑定用户 1为是 0为否
    optional int32 nflag = 5; //是否能看见邀请码相关内容开关 0：关 1：开
}

//切换俱乐部请求 ClubSSwitchReq_CMD
message ClubSSwitchReq
{
    required int32 nUserId =1      [default = 0];
    required int32 nNewClubId = 2  [default = 0]; //要去的俱乐部id
}

//切换俱乐部回复 ClubSSwitchResp_CMD
message ClubSSwitchResp
{
    required int32 nRlt = 1;    //1:没有找到玩家 2:离开俱乐部失败 3:请求过于频繁，等待上一个请求结束
    required string sErrStr = 2; //错误信息
    required int32 nNewClubId = 3; //要去的俱乐部id
    required int32 nNowClubId = 4; //现在的俱乐部id
}

//俱乐部场景数据
message ClubSScene
{   
    required int32 nClubId = 1;           //俱乐部id
    required string sClubName = 2;        //俱乐部名称(Base64编码)
    required double nClubGold = 3;        //俱乐部资产(俱乐部币)
    required ClubSUser tMyself = 4;       //个人信息
    required double nIncome = 5;          //总收益(俱乐部币)
    required double nTodayIncome = 6;     //今日收益(俱乐部币)
    required int32 nMaxUserCnt = 7;       //俱乐部人数上限
    required int32 nClubTax = 8;          //俱乐部桌服务费分成(在抽水中的占比),需要除以1000,如分成=95%,nClubTax=950
    required int32 nInsuranceTax = 9;     //俱乐部桌保险分成(在保险中的占比),需要除以1000,如分成=95%,nInsuranceTax=950
    optional int32 nApplyJionCnt= 10;     //加入俱乐部申请数目(有成员管理权限的用户才有)
    optional int32 nApplyAddGoldCnt= 11;  //增加俱乐部币申请数目(有俱乐部币管理权限的用户才有)
    optional int32 nApplyCutGoldCnt= 12;  //增加俱乐部币申请数目(有俱乐部币管理权限的用户才有)
    optional int32 nCanSearch = 13;       //是否允许搜索 0:允许 1:不允许
    optional int32 nCanApply = 14;        //是否允许申请加入 0:允许 1:不允许
    optional ClubSUser tMasterInfo = 15;  //主席基本信息(增加 减少金币会用到)
    required bool IsUseGold = 16;         //俱乐部是否使用金币
    required bool IsUserClubGold = 17;    //俱乐部是否使用俱乐部币
    required double nGold = 18;	          //俱乐部资产(金币)
	required double nGoldIncome = 19;	  //总收益(金币)
    required double nGoldTodayIncome = 20;//今日收益(金币)
    
    optional string sClubConfig = 21;        //俱乐部配置: json 
    /*
        IsManchu --牌桌满人开关 
        arrOpenGameId ={}  -- 开放游戏id
    */
    optional int32 nAdertisementGoldLeftCnt = 22;        //看广告赠送金币今日剩余次数（登录大厅俱乐部时才有）
}

//俱乐部用户信息(个人)
message ClubSUser
{   
    required int32 nUserId=1;				//玩家id
	required string sFaceId=2;				//url
	required string sName=3;				//昵称
	required int32 nSex=4;	    			//性别 0:男 1:女
    required int32 nClubId=5;               //俱乐部id
    required string sShopAcc=6;			    //第三方id
    optional int32 nIdentify=7;             //身份  1:主席  10:管理员  20:普通成员
	optional double nContribution=8;        //累计贡献(俱乐部币)
    optional string sPower=9;				//权限 json格式 [{nPowerType,isOpen},...] 
                                            // nPowerType权限类型:1:成员管理权限 2:俱乐部币管理权限 3:开桌管理权限.  
                                            // isOpen是否开启 true:开启  false:关闭
	optional double nGold=10;				//金币
	optional double nClubGold=11;			//俱乐部币
    optional int32 nWeekCount=12;           //本周局数
    optional double nGoldContribution=13;   //累计贡献(金币)
    optional string nCreateTime=14;         //加入时间
}

//创建俱乐部请求 ClubSCreateReq_CMD
message ClubSCreateReq
{
    required string sClubName = 1  [default = ""];  //俱乐部名称(Base64编码)

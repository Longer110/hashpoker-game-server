}

//申请加入俱乐部回复 ClubSApplyResp_CMD
message ClubSApplyResp
{
    required int32 nRlt = 1;    //0:成功 1:参数错误 2:俱乐部不存在 3:已申请 4:俱乐部设置不能申请 5:已在俱乐部中 6:玩家与俱乐部不是同一个分组 7:在黑名单中 8:申请数目达到上限 99:数据库操作失败
    required string sErrStr = 2; //错误信息
}

//修改俱乐部信息请求(主席) ClubSChangeInfoReq_CMD
// string sClubName = 2;          //俱乐部名称(Base64编码)
// int32 nCanSearch = 3;          //是否允许搜索 0:允许 1:不允许
// int32 nCanApply = 4;           //是否允许申请加入 0:允许 1:不允许
// sOldPassWord = 5;       //库存密码(旧)
// sNewPassWord = 6;       //库存密码(新)
message ClubSChangeInfoReq
{
    message Item {
        required string sKey = 1;
        required string sVal = 2;
    }
    required int32 nClubId = 1 [default=0]; //俱乐部id
    repeated Item arrItem = 2;
}

//修改俱乐部信息回复(主席) ClubSChangeInfoResp_CMD
message ClubSChangeInfoResp
{   
    required int32 nClubId = 1;       //俱乐部id
    repeated ClubSRltItem arrRlt = 2; //修改结果
    required int32 nRlt = 3; //总的修改结果,所有项都修改成功才算成功，其中一项失败都算失败 0:成功 1:失败
}

message ClubSRltItem
{
    required int32 nRlt = 1;    //0:成功 1:没有权限,2:俱乐部名字已存在 3:参数错误 4:旧的库存密码不正确 5:新旧值相同 6:俱乐部不存在 7:名字超长 8:含有特殊字符 9:含有敏感词 99:数据库操作失败
    required string sKey = 3;  //修改的项 sClubName,nCanSearch,nCanApply,sPassWord
}


syntax = "proto2";
//俱乐部协议

//俱乐部成员身份 1:主席  10:管理员  20:普通成员  （中间留空一些数字，方便以后增加其它身份）

//俱乐部id    <1000000:大厅,大厅的id就是玩家所在分组的id    1000000~: 私人创建的俱乐部

//俱乐部权限 1:成员管理权限 -> 处理加入申请；踢出成员；加入黑名单；移除黑名单  
//           2:俱乐部币管理权限 -> 处理成员增加和退还俱乐部币的申请；把俱乐部账户的俱乐部币转给成员；强制回收成员的俱乐部币
//           3:开桌管理权限 -> 开桌

package ClubSlave_pb;


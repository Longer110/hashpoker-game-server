    {
        required int32 nClubId = 1;  //俱乐部id
        required string sClubName = 2;  //俱乐部名称(Base64编码)
        required string sMasterName = 3; //主席昵称
        required int32 nUserCnt = 4; //目前成员个数
        required int32 nMaxUserCnt = 5; //最大成员个数
        required int32 nStatus = 6; //状态 0:未申请 1:已申请  2:已加入
        required int32 nMaster = 7; //主席id
    }

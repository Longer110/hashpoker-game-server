// 账单记录
message PayOrder{
    optional string sCreateTime = 1;      	// 日期和时间
    optional int32 nPayType= 2;      		// 操作: 1 充值、2提现 
    optional int32 nChannelType  = 3;       // 类型: 0、MomoPay、1：ZaloPay、2银行扫码、3直連、4网关、5USDT
    optional int32 nGoldType= 4;      		// 币种: 1、人民币，2、越南盾，3、USDT
    optional double nCount = 5;    			// 数量 
    optional double nGoldChange= 6;     	// 金币变化 
    optional double nBalance = 7;           // 可用金币  
    optional int32 id= 8;      				// id
    optional int32 nAuditStatus= 9;         //提现审核状态:  0:待审核 1:审核通过  2:审核不通过
    optional double nExchangeRate= 10; 	    //汇率:   货币转金币的汇率  
    optional string sBankAccount = 11;      //银行账号:  
    optional int32 nState= 12;      		// 充值订单状态: 0待处理 1成功 
}

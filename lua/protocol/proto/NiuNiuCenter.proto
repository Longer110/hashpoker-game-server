message NNCUserBetNotify {
    message Bet {
        required double nBetChip = 1;
        required int32 nBetArea = 2;
    }
    message arrBetInfo {
        required int32 nUserId = 1;
        repeated Bet arrBet = 2;
    }
    required string sTableId = 1;
    repeated arrBetInfo arrBetInfo = 2;
}

message NNCUserEnterNotifyReq {
    required string sTableId = 1;
    required int32 nUserId = 2;
}

message NNCUserEnterNotify {
    required string sTableId = 1;
    required int32 nUserId = 2;
}

message NNCFollowLockChangeNotifyReq {
    required int32 nUserId = 1;
    required int32 nLock = 2;
    required string sTableId = 3;
}

message NNCFollowLockChangeNotify {
    required int32 nUserId = 1;
    required int32 nLock = 2;
    required string sTableId = 3;
}

message NNCCommonReq {
    required string sCmd = 1;

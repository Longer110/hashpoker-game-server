}

message NNCPileInfoNotify {
    message CardItem {
        required int32 nCardDex = 1;
        required string sEncryptText = 2;
        required string sClearText = 3;
        required int32 nCard = 4;
    }
    required string sTableId = 1;
    required int32 nBootsno = 2;
    required int32 nStartKey = 3;
    required int32 nEndKey = 4;
    required int32 nMaxDex = 5;
    repeated CardItem arrCardItem = 6;

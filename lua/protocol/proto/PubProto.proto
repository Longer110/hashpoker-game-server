    required int32 SUB_REQ_PILOT_CONTROLRECORD = 31 [default = 47];
    required int32 SUB_REQ_GAMELISTCFG = 100 [default = 50];
    required int32 SUB_REQ_GAMESTYPECFG = 101 [default = 51];
    required int32 SUB_REQ_LOADANDROIDCFG = 120 [default = 120];
    required int32 SUB_REP_LOADANDROIDCFG = 121 [default = 121];
    required int32 SUB_REQ_SAVEANDROIDITEM = 125 [default = 125];
    required int32 SUB_REQ_ClEANMYSQL = 126 [default = 126];

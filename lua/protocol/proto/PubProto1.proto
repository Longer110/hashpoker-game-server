    optional int32 nUserID = 1 [default = -99];
    optional string sLastTime = 2 [default = ""];
  }
  
  optional int32 nScopeID = 1 [default = -99];
  optional string sTimestamp = 2 [default = ""];
  repeated JZ_UserSInfo tJZ = 3;
}

message REP_Control_User_Data {
  message Control_Data_User_Res {
    optional int32 nType = 1 [default = -99];
    optional string sRTime = 2 [default = ""];
    optional int32 nUserID = 3 [default = -99];
    optional double dWinLose = 4 [default = -99];
    optional double dDrawWater = 5 [default = -99];
    optional double dStatVal = 6 [default = -99];
    optional bool bEnd = 7 [default = false];
  }
  
  repeated Control_Data_User_Res tResData = 1;
  optional int32 nScopeID = 2 [default = -99];
  optional string sTimestamp = 3 [default = ""];
  optional bool bEnd = 4 [default = false];
}

message REQ_Control_User_Stat_Data {
  message JZ_UserSInfo {
    optional int32 nUserID = 1 [default = -99];
    optional string sLastTime = 2 [default = ""];
    optional bool bEndControl = 3 [default = false];
  }
  
  repeated JZ_UserSInfo tJZ = 3;
}

message REQ_Control_GetNew_User {
  optional int32 nScopeID = 1 [default = -99];
  optional int32 nStartID = 2 [default = -99];
  optional int32 nEndID = 3 [default = -99];
  optional string sTimestamp = 4 [default = ""];
}


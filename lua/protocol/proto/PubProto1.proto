syntax = "proto2";

package PubProto1_pb;

message Protocol1 {
  message Sys {
    required int32 CONTROL = 1 [default = 2100];
    required int32 BurMain = 2 [default = 2101];
    required int32 WebMain = 3 [default = 2102];
  }
  
  message Sub_Control {
    required int32 CONTROL_INFO = 1 [default = 1];
    required int32 CONTROL_ROOMINFO = 2 [default = 2];
    required int32 CONTROL_USERINFO = 3 [default = 3];
    required int32 CONTROL_WEB_SETPOOL = 4 [default = 6];
  }
  
  message Sub_BurData {
    required int32 Bur_UserInfoREQ_CMD = 1 [default = 1];
    required int32 BUR_USERINFORSP_CMD = 2 [default = 2];
  }
  
  message Sub_Web {
    required int32 WebMessReq_CMD = 1 [default = 1];
    required int32 WebPublicMessReq_CMD = 2 [default = 2];
  }
  
  message Sub_DB {
    required int32 SUB_REQ_QUICKDBJSON = 133 [default = 133];
    required int32 SUB_REP_QUICKDBJSON = 134 [default = 134];
    required int32 SUB_REQ_QUICKDBSAVE = 135 [default = 135];
    required int32 SUB_REQ_QUICKDBLOAD = 136 [default = 136];
    required int32 SUB_REP_QUICKDBLOAD = 137 [default = 137];
    required int32 SUB_REQ_JUSTEXCUTE = 138 [default = 138];
  }
}

message WebMessReq {
  optional string strHMsg = 1;
  optional string sSendType = 2;
  optional string sBody = 3;
}

message Bur_UserInfoREQ {
  optional string tBuildUserData = 1 [default = ""];
}

message Bur_UserInfoRSP {
  optional int32 nResult = 1 [default = -99];
  optional string sFReport = 2 [default = ""];
}

message RUQ_UpdateUserInfo {
  optional string nClientID = 1 [default = ""];
  optional int32 nUserID = 2 [default = -99];
  optional string sSql = 3 [default = ""];
  optional int32 nType = 4 [default = -99];
  optional string sContent = 5 [default = ""];
  optional int32 nResult = 6 [default = -99];
}

message REQ_Kick_User {
  optional int32 nUserId = 1 [default = -99];
  optional int32 nType = 2 [default = -99];
}

message REQ_Control_UserInfo {
  message REQ_C_UserInfo_Item {
    optional int32 nUserId = 1 [default = -99];
    optional bool isControl = 2 [default = false];
  }
  
  optional int32 nShopId = 1 [default = -99];
  optional int32 nGameId = 2 [default = -99];
  optional int32 nLevelId = 3 [default = -99];
  repeated REQ_C_UserInfo_Item tCItems = 4;
}

message REQ_Control_TableInfo {
  optional int32 nShopId = 1 [default = -99];
  optional int32 nGameId = 2 [default = -99];
  optional int32 nLevelId = 3 [default = -99];
  optional string sTableId = 4 [default = ""];
  optional double dWinLose = 5 [default = -99];
  optional double dDrawWater = 6 [default = -99];
  optional string sPaiJuId = 7 [default = ""];
}

message REQ_Control_Record {
  optional string sSql = 1 [default = ""];
}

message REQ_Control_Data {
  message JZ_StartID {
    optional int32 nGameID = 1 [default = -99];
    optional int32 nRoomID = 2 [default = -99];
    optional string sLastTime = 3 [default = ""];
    optional bool bEndControl = 4 [default = false];
  }
  
  optional int32 nGroupID = 1 [default = -99];
  optional string sBRGameIDs = 2 [default = ""];
  optional string sTimestamp = 3 [default = ""];
  repeated JZ_StartID tJZID = 4;
}

message REP_Control_Data {
  message Control_Data_Res {
    optional int32 nType = 1 [default = -99];
    optional int32 nGroupID = 2 [default = -99];
    optional int32 nGameID = 3 [default = -99];
    optional int32 nRoomID = 4 [default = -99];
    optional string sRTime = 5 [default = ""];
    optional int32 nUserID = 6 [default = -99];
    optional double dWinLose = 7 [default = -99];
    optional double dDrawWater = 8 [default = -99];
    optional double dStatVal = 9 [default = -99];
  }
  
  repeated Control_Data_Res tResData = 1;
  optional int32 nGroupID = 2 [default = -99];
  optional string sTimestamp = 3 [default = ""];
  optional bool bEnd = 4 [default = false];
}

message REQ_Check_User {
  message REQ_Check_TVal {
    optional int32 nGroupID = 1 [default = -99];
    optional int32 nTriggerVal = 2 [default = -99];
  }
  
  optional int32 nStartID = 1 [default = -99];
  optional int32 nEndID = 2 [default = -99];
  repeated REQ_Check_TVal tTVal = 3;
}

message REQ_Control_User_Data {

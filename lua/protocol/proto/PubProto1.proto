  optional bool bEnd = 4 [default = false];
}

message REP_UserID_Scope_Data {
  message REP_UserID_Scope_Item {
    optional int32 nID = 1 [default = -99];
    optional int32 nStartID = 2 [default = -99];
    optional int32 nEndID = 3 [default = -99];
  }
  
  repeated REP_UserID_Scope_Item tItems = 1;
}

message REQ_Control_Room_Data {
  optional int32 nShopId = 1 [default = -99];
  optional int32 nGameId = 2 [default = -99];
  optional int32 nLevelId = 3 [default = -99];
  optional int32 nUserId = 4 [default = -99];
  optional double dWinLose = 5 [default = -99];
  optional double dDrawWater = 6 [default = -99];
  optional double dRoomUserStat = 7 [default = -99];
  optional double dUserStat = 8 [default = -99];
  optional bool isControl = 10 [default = false];
  optional int32 nLock = 11 [default = 0];
  optional int32 nLuck = 12 [default = 0];
  optional int32 nRoomLock = 13 [default = 0];
  optional int32 nRoomLuck = 14 [default = 0];
  optional bool isFirst = 15 [default = false];
  optional double dUnlockGames = 16 [default = 0];
  optional double dUnlockVal = 17 [default = 0];
}

message RUP_BRWriteTreasure {
  message tUserTreasure {
    required int32 nUserId = 1 [default = -99];
    required int32 nChannel = 2 [default = -99];
    required double nDel = 3 [default = -99];
  }
  
  repeated tUserTreasure arrUserTreasure = 1;
  required int32 nSourceType = 2 [default = -99];
  required int32 nRoomId = 3 [default = -99];
}

message MasterSlave_Proto {
  required int32 Main = 1 [default = 400];
  required int32 SUB_REQ_ADDSLAVE = 2 [default = 2];
  required int32 SUB_REP_ADDSLAVE = 3 [default = 3];
  required int32 SUB_MasterBroadcastSlave = 4 [default = 4];
  required int32 SUB_MasterTransmitSlave = 5 [default = 5];
  required int32 SUB_SlaveTransmitMaster = 6 [default = 6];
  required int32 SUB_GuessInformGameSrv = 7 [default = 7];
}

message Req_AddSlave {
  required int32 nSrvId = 1 [default = 1];
  required string sKey = 2 [default = ""];
  optional int32 nGameId = 3 [default = 0];
}

message Rep_AddSlave {
  required int32 nSrvId = 1 [default = 1];
  required string sKey = 2 [default = ""];
  required int32 nResult = 3 [default = 0];
}

message MasterBroadcastSlave {
  required string sTableId = 1 [default = ""];
  required string strProto = 2 [default = ""];
  optional string sSendData = 3 [default = ""];
}

message MasterTransmitSlave {
  required string sClientID = 1 [default = ""];
  required string strProto = 2 [default = ""];
  optional string sSendData = 3 [default = ""];
}

message GuessInformGameSrv {
  required string sTableId = 1 [default = ""];
  required string strProto = 2 [default = ""];
  optional string sSendData = 4 [default = ""];
}

message WebPublicMessReq {
  optional string sBody = 1;
}

message REQ_Club_Recharge {
  required int32 nUserId = 1 [default = -1];
  required double nAmount = 2 [default = 0];
}
	message UserBet{
		required int32 nPos=1;
		required double nBet=2;
	}
	message UserPartIn{
		required int32 nPos=1;
		required double nTakeIn =2;			//玩家余额(下注后)
		optional double nBet=3;				//玩家大小盲或强制盲
		optional double nPreAnte=4;			//前注
	}
	repeated int32 arrPosPartIn=1;					//参与本局游戏的玩家座位号(每人发两个底牌,只能自己看到自己的底牌是啥) (发牌顺序按数组顺序) "可选择废弃 改用第8字段"
	required int32 nBankerPos=2;					//庄家座位号(头像显示标识:'D')
	repeated UserBet arrUsersBet=3;					//(大小盲,强盲)玩家下注	"可选择废弃 改用第8字段"
	repeated int32 arrHoleCards=4;					//自己的底牌(2张,因为延迟看牌,可能是两个0)
	required int32 nCardType =5;					//自己当前牌型(见本文件头部"牌型定义")
	optional ClubDeZhouSCPreOpOption tPreOpOption=6; 	//自己当前可预操作选项
	required double nTakeIn =7;						//初始筹码带入
	repeated UserPartIn arrUserPartIn=8;			//参与本局游戏的玩家信息(发牌顺序按数组顺序,小盲->大盲->强盲->...)
	optional double nChipBuy =9;					//新增筹码数量 
	optional string sPaiJuId=10;					//牌局id
	repeated ChatItem arrChat=11;					//表情价格列表
	optional int32 nInsureStatus =12;					//可购买保险状态 0正常 1不能买 
	optional double nTotalWinGold=13;					//总盈利
	optional int32 nPlayCnt=14;					//总手数
}

//操作权获得通知 (倒计时使用场景信息中的 "操作最大时间")
message ClubDeZhouSCOperationNotify
{
	message HandCard{
		repeated int32 arrHoleCards=1;			//底牌(2张)
		required int32 nCardType =2;			//牌型(见本文件头部"牌型定义")
	}

//保险面板数据
message  SCInsurPanelData
{
	message RelevantUser{
		required int32 nUserId=1;		//玩家id
		required string sName=2;		//玩家昵称
		repeated int32 arrHoleCards=3;	//底牌
		required int32 nOuts=4;			//-1:保险购买中, >= 0:OUTS数量, 其它:无意义
	}
	message ElseUserHoleCard{
		repeated int32 arrOuts=1;		//占outs的手牌(高亮显示)
		repeated int32 arrCard=2;		//其它手牌
	}
	message Remaining{
		repeated int32 arrOuts=1;		//剩余outs
		required int32 nPileCnt=2;		//牌堆剩余牌数量
		required double nOdds=3;		//赔率
	}
	message Pool{
		required double nInsurePool=1;	//可投保池
		required double nPool=2;		//底池
		required double nInvest=3;		//投入
		optional int32 nPoolId=4;		//底池Id
	}
	message InsurancePlan{
		required int32 nPlanId=1;		//投保方案 0:(保本),1:(满池),2:(1/2底池),3:(1/3底池),5:(1/5底池),8:(1/8底池)
		required double nCosts=2;		//方案所需金币 
	}	 
	
	repeated RelevantUser arrRelevantUser=1;			//与保险相关的玩家显示
	repeated int32 arrCommunityCards=2;			 		//公共牌
	optional ElseUserHoleCard tElseUserHoleCard=3;		//其他玩家手牌
	required Remaining tRemaining=4;					//剩余outs,牌堆剩余多少张牌,赔率
	required Pool tPool=5;								//可投保池,底池,投入
	repeated InsurancePlan arrInsurancePlan=6;			//投保方案
	required int32 nSeconds=7;							//剩余购买保险时间 (秒)
	required int32 nInsurUserId=8;						//可以买保险的玩家id 
	
	optional int32 nInsureMode=9;	  					//保险模式 1:传统保险 2:低水保险
	repeated double arrOddsList=10;						//赔率表(传统保险才有效);按数组顺序,值1为补牌1赔率、值2为补牌2赔率...
	optional bool isMustBuy=11;							//是否必须购买保险(true时，保险玩家必须购买所有outs保险)
	optional bool isPossibleEq=12; 						//是否存在平分的可能 true:是, 其它:否 (传统保险才有效)
	optional double nInvestInThisPool=13;				//保险玩家在该池的投入(触发保险的最大池) 

}

//进入保险阶段
message ClubDeZhouSCInsurNotify{
	message ShowCard{
		message Item{
			required int32 nPos=1;			//座位号
			repeated int32 arrHoleCards=2;	//底牌(2张)
			required int32 nCardType=3;		//牌型
		}
		repeated Item arrHoleCard=1;
	}
	message PoolChange{
		repeated double arrPot =1;			//变化后的底池
	}
	optional ShowCard tShowCard=1;					//亮牌     (如已亮过牌，则字段不存在)
	optional PoolChange tPoolChange=2;				//底池变化 (如底池无变化,则字段不存在)
	repeated SCInsurPanelData tInsurPanelData=3;		//保险面板
	repeated WinRate arrWinRate=4;					//玩家胜率
	repeated PotUser potUsers =5;					       //已收归的各底池玩家对应信息
	optional int32 nInsureStatus =6;					//可购买保险状态 0正常 1不能买 
}

//保险后发牌通知(同时表示最近保险阶段结束)
message ClubDeZhouSCInsurDealNotify{
	message CardType{
		required int32 nPos=1;				//座位号
		required int32 nCardType=2;			//变化后的牌型
		repeated int32 arrCombinedCards=3;	//能组成最大牌型的5个牌
	}
	message Choice{
		required int32 nPos=1;				//投保玩家座位号
		required double nChoice=2;			//>0:投保xx ,其它:不投保
	}
	required int32 nCard=1;					//转牌或河牌
	repeated CardType arrUsersCardType=2;	//发牌后，各玩家的牌型变化
	repeated Choice tChoice=3;				//投保玩家投保数额
	repeated WinRate arrWinRate=4;					//玩家胜率
	optional int32 nHit=5;                  //保险中牌 4转牌 5河牌
}
//保险购买请求
message ClubDeZhouSCInsurBuyReq{
	message InsurBuyItem {
		required int32 nPlanId=1;    //投保方案 -1不买 ,0:(保本),1:(满池),2:(1/2底池),3:(1/3底池),5:(1/5底池),8:(1/8底池)
		required int32 nPoolId=2;    //底池Id
	}
	required int32 nPlanId=1;				//投保方案 -1不买 ,0:(保本),1:(满池),2:(1/2底池),3:(1/3底池),5:(1/5底池),8:(1/8底池)
	repeated int32 arrOuts=2;				//购买保险的outs (传统保险且非必须购买时有效)
	repeated InsurBuyItem nBuy=3;           //购买信息
}
//保险购买回复
message ClubDeZhouSCInsurBuyRsp{
	required int32 nCode=1;				   //0:成功, 其它失败
	required int32 nPlanId=2;			   //投保方案
	optional double nCost=3;
}


//公共牌新增通知 (该通知表示一轮的结束,先收归玩家下注筹码,再亮玩家底牌,接着发公共牌)
message ClubDeZhouSCDealNotify
{
	//玩家底牌
	message UserHoleCard{
		required int32 nPos=1;			//座位号
		repeated int32 arrHoleCards=2;	//底牌(2张)
		required int32 nCardType=3;		//牌型 (本次新增公共牌前 的牌型)
		repeated int32 arrCardType=4;	//三个元素: 分别为与前3、前4、前5个公共牌组合成的牌型
	}
	required double nPotSum =1;						//底池总额(已押筹码总额)
	repeated double arrPot =2;						//收归的各底池数额(池数量:>0),数组索引代表池ID,索引从1开始
	repeated UserHoleCard arrUsersHoleCard=3;		//各玩家的底牌(某些情况下非空数组);
	repeated int32 arrCards=4;						//新增的公共牌
	required int32 nCardType=5;						//新增公共牌后，自己的牌型(见本文件头部"牌型定义")
	optional ClubDeZhouSCPreOpOption tPreOpOption=6; 	//自己当前可预操作选项
	repeated int32 arrCombinedCards=7;				//能组成最大牌型的5个牌
	repeated WinRate arrWinRate=8;					//玩家胜率
	repeated PotUser potUsers =9;					       //已收归的各底池玩家对应信息
	optional int32 nInsureStatus =10;					//可购买保险状态 0正常 1不能买 
}

//结算信息
message ClubDeZhouSCSettleNotify
{
	message GetItem{	
		required double nGold=1;			//获得的金币
		required int32 nPotIdFrom=2;		//金币来源(池ID)
	}
	message UserGetFromPot{
		required int32 nPos=1;				//座位号
		repeated int32 arrHoleCards=2;		//底牌(该玩家可能在公共牌阶段已亮过牌,前端看重复亮牌会不会有问题)
		repeated int32 arrCombinedCards=3;	//能组成最大牌型的5个牌
		required int32 nCardType=4;			//牌型(见本文件头部"牌型定义")
		repeated GetItem arrGoldGet=5;		//从各个池处中获得的金币
		required bool isWin =6;				//true时高亮牌型.
		optional double nProfit=7;			//盈利.>0时显示"胜利"
		optional int32 nCmpValue=8;			//牌型相同时,由该字段决定大小
		optional bool isShowCardWhenEnd=9;	//是否亮牌,true:是 其它:否
		optional double nCurGold=10;		//玩家当前筹码值(结算后)
		optional double nInsurProfit=11;    //保险收入
		optional int32 nInsureCardVal=12;    //保险中牌 4转牌 5河牌 9转牌+河牌
		optional double nDrawChips=13;    //撤码成功数值
	}
	repeated UserGetFromPot arrUsersWin=1;			//所有玩家牌型与输赢情况(弃牌玩家除外)
	optional ClubDeZhouSCPreOpOption tPreOpOption=2; 	//自己当前可预操作选项 (用于让弃牌玩家弹"亮牌" 操作)
	repeated double arrPot =3;						//收归的各底池数额(池数量:>0),数组索引代表池ID,索引从1开始
	optional double nCardOpenFee=4;					//>=0:翻牌费用,其它:不能翻牌
	optional double nTempChips=5;					//暂存区数值
	optional double nTotalWinGold=6;					//在该牌桌上总盈利
	optional int32 nPlayCnt=7;					//在该牌桌上总玩的局数
}

//有玩家亮牌通知 (结算阶段且弃牌玩家才会亮牌)
message ClubDeZhouSCShowCardNotify
{
	required int32 nPos=1;				//亮牌玩家座位号
}



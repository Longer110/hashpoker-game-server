}

//牌桌总览请求
message ClubDeZhouSCOverViewReq{
	optional int32 nNoUse=1;	//0或nil:新的请求 ,1:继续获取剩下的数据, -1:总览界面关闭
}
//牌桌总览回复
message ClubDeZhouSCOverViewRsp{
	message Item{
		required int32 nUserId=1;		//用户id
		required string sName=2;		//昵称
		required int32 nStatus=3;		//状态 0:正常 1:离桌(头像变灰)
		optional int32 nPlayCnt=4;		//局数
		optional double nPayRate=5;		//入池率(假如值为8即代表8%)
		optional double nTakeIn=6;		//带入
		optional double nProfitSum=7;	//盈亏
		optional string sFaceId=8;	    //头像url
		optional double nTakeOutChips=9;	//撤码数值
	}
	message InsuranceItem {
		required int32 nUserId=1;		//用户id
		required string sName=2;		//昵称
		required int32 stage=3;		    //阶段 1转牌 2:河牌
		required double buy=4;		   //投保金额
		required double win=5;		   //赔付
		required int32 hand=6;         //局数
	}
	message RevenueItem{
		required int32 nUserId=1;		//用户id
		required string sName=2;		//昵称
		required int32 nStatus=3;		//状态 0:正常 1:离桌(头像变灰)
		optional double nGoldCnt=4;		//收益金额
	}
	message PenaltyItem{
		required int32 nUserId=1;		//用户id
		required string sName=2;		//昵称
		required int32 nStatus=3;		//状态 0:正常 1:离桌(头像变灰)
		optional int32 nPlayCnt=4;		//局数
		optional int32 nLimitPlayCnt=5;		//离桌限制局数
		optional double nWinGold = 6;  // 盈利金额
		optional double nGoldCnt=7;		//罚款金额
		repeated RevenueItem arrRevenue=8; // 受益人列表
	}
	required string sPaiJuId=1;				//牌局编号
	required string sTableName=2;			//牌桌名称
	required double nSmallBlind=3;			//小盲
	required double nBigBlind=4;			//大盲
	repeated Item arrPartInUser=5;			//参与过牌局的用户
	repeated Item arrLooker=6;				//观看用户
	optional double nBetBefore=7;			//前注
	optional double nInsur =8;				//保险赔付
	optional int32 nRound=9;				//第几手
	optional int32 nRemainTime=10;			//桌子剩余时间 秒(-1:表示无限)
	optional int32 nEndFlag =11;			//列表arrPartInUserd的结束标记(1:列表还未结束, 其它:已结束)
	optional double nZhuaTou = 12;
    optional double nPreAnte = 13;
	repeated InsuranceItem arrInsurance=14;				//保险信息
	optional double nInsurGot =15;				//保险收入
	repeated PenaltyItem  arrPenalty=16;				//罚款信息
} 

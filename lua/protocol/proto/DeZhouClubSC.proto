//房主点击了"开始游戏" 通知
message ClubDeZhouSCAutoNextNotify{
	required bool isAutoNext=1;			//下局是否自动开始 (必然true)(废弃字段)
}
//桌子重置
message ClubDeZhouSCTableResetNotify
{
	optional int32 nNoUse=1;			//没用字段
	optional bool isAutoNext=2;			//下局是否自动开始 true:是, false:房主需要点击一次 "开始游戏"(前端判断>=2人时才给房主显示该按钮)(废弃字段)
}

//开局倒计时通知
message ClubDeZhouSCToStartNotify
{
	required int32 nMSeconds =1;  	// >0:倒计时时间(毫秒),并取消暂停(如果有), 0:取消倒计时或暂停(如果有), -1:取消倒计时(如果有),并暂停等待(等待时间为nPauseRemain)
	optional int32 nPauseRemain=2;  //>0:暂停等待时间(单位:秒) (nMSeconds为-1时有效)
}


//异常提示通知
message ClubDeZhouSCFailNotify
{
	required int32 nCode=1;						//错误码,见错码定义
	optional string sErr=2;						//错误提示
	optional ClubDeZhouSCTakeInRangeRsp tRsp=3;	//最小最大带入(金币不足时有)
	optional double nLoseMaxAmount = 4;         //输钱限制金额
}

//DeZhouFailNotify 错误码定义
//11:金币不足(登陆游戏成功, 但坐下失败时) 0
//12:金币不足('坐下'请求失败时) 0
//13:金币不足(被请离座位后) 

//14:座位不足('坐下'请求失败时) 0
//15:重复坐下(已在座位上,'坐下'请求失败时) 0 
//16:重复站起(当前不在座位上,'站起'请求失败) 0

//17:超时站起 (因超时被踢出座位后)
//18:桌子解散 

//19:主播未配置房间(坐下失败)
//20:被强制站起 (被主播)

//21:被强制站起 (被后台管理员)
//22:被管理员请离该牌桌(返回大厅)
//23:封禁

//30:输钱限制到达
//31:缺少gps信息，坐下失败
//32:存在距离过近的玩家,坐下失败
//33:缺少IP信息，坐下失败
//34:存在相同IP的玩家,坐下失败
//35:入池率过低,坐下失败
//36:金币不足,魔法表情使用失败
//40:输钱达到限制
//41:手数限制

//Gm命令 请求
message ClubDeZhouSCGmReq
{
	required string sStr=1;		//Gm命令
}


//最近牌局记录查询 请求
message ClubDeZhouSCRecordReq{
	required int32 nQueryCnt=1 [default = 10];	//查询记录的返回条数(最多50)
	required int32 nMinId=2 [default = 0];		//(分页查询时,需要填上一次结果的最后一条记录id,即是最小的id)
}

//最近牌局记录查询 返回
message ClubDeZhouSCRecordRsp{
	message Item{
		required string sSeriesNumber=1;	//牌局编号
		required string sTime=2;			//时间
		required double  nBet=3;				//下注
		required double nWin=4;				//派彩
		required int32 Id=5;				//记录id. (最大的就是最近的记录)
	}
	repeated Item arrItem=1;				//已排序记录
	required int32 nMinId=2;				//最后一条记录id,用于查询下一页,如果需要
}


//牌局记录详情查询 请求
message ClubDeZhouSCRecordDetailReq{
	required string sSeriesNumber=1;	//牌局编号
}
//牌局记录详情查询 返回
message ClubDeZhouSCRecordDetailRsp{
	message Item{
		required string sName=1;		//玩家昵称
		repeated int32 arrHoleCards=2;	//底牌
		required double  nBet=3;		//下注
		required double nWin=4;			//派彩
		required int32 nUserId=5;		//玩家ID
	}
	required string sSeriesNumber=1;	//牌局编号
	repeated int32 arrCommunityCards=2; //公共牌
	repeated Item arrItem=3;			//牌局各玩家记录
}

//踢人请求 (给主播踢人用)
message ClubDeZhouSCKickUserReq{
	required int32 nPos=1;			//强制站起的对象(座位号)
}
//踢人回复
message ClubDeZhouSCKickUserRsp{
	required int32 nRlt=1;			//0:踢出成功 1:本局结束后踢出 其它:失败
}

//暂停状态设置 请求 (仅主播能用)
message ClubDeZhouSCPauseReq{
	required bool isPause =1;		//true:设置为暂停 false:设置为非暂停
}
//暂停状态设置 返回
message ClubDeZhouSCPauseRsp{
	required bool isPause=1;		//当前桌子暂停状态
}


//金币变化通知
message ClubDeZhouSCGoldNotify{

syntax = "proto2";

package DeZhouClubSC_pb;

//命令ID
//注意: 命名规则为协议名称加后缀 '_CMD' ;本游戏服代码中,以这一规则来寻找协议命令的。
//命名为啥加个ClubDeZhouSC前缀，因为与其他游戏命名冲突

//牌值定义:
//  0x11,0x16,0x17,0x18,0x19,0x1a,0x1b,0x1c,0x1d,	--方块 A~K
//	0x21,0x26,0x27,0x28,0x29,0x2a,0x2b,0x2c,0x2d,	--梅花 A~K
//	0x31,0x36,0x37,0x38,0x39,0x3a,0x3b,0x3c,0x3d,	--红桃 A~K
//	0x41,0x46,0x47,0x48,0x49,0x4a,0x4b,0x4c,0x4d,   --黑桃 A~K

//牌型定义
// 0没牌或不可见 1高牌 2对子 3两对 4三条 5顺子 6葫芦 7同花 8四条(金刚) 9同花顺 10皇家同花顺

//顺时针方向定义:座位号1->6->9
//前端下注、跟注、加注 xx动作定义 :飞xx筹码(累加)到玩家下注区,同时从玩家余额中减掉同等xx筹码,接着累加同等xx筹码到底池总额.
//结算 :前端把从底池赢得的金币累加回余额

message ClubDeZhouSC_Proto {			    
	required int32 Main_CMD =1 			[default = 232];					//主命令 (不可改)-- 德州短牌 
	required int32 ClubDeZhouSCLogOnReq_CMD =2 [default = 2]; 				//登陆请求 (进入游戏，需要先登陆)
	required int32 ClubDeZhouSCLogOnRsp_CMD =3 [default = 3];					//登陆回复
	required int32 ClubDeZhouSCUserSitDownNotify_CMD =4 [default = 4]; 		//有玩家坐下通知
	required int32 ClubDeZhouSCUserStanpUpNotify_CMD =5 [default = 5]; 		//有玩家从座位上站起通知
	required int32 ClubDeZhouSCStartNotify_CMD =6 [default = 6];       		//游戏开始通知
	required int32 ClubDeZhouSCOperationNotify_CMD =7 [default = 7];   		//操作权获得通知 (倒计时使用场景信息中的 "操作最大时间")
	required int32 ClubDeZhouSCOpReq_CMD =8 [default = 8];					//操作请求
	required int32 ClubDeZhouSCOpNotify_CMD =9 [default = 9];          		//有玩家操作通知
	required int32 ClubDeZhouSCDealNotify_CMD =10 [default = 10];        		//公共牌新增通知 
	required int32 ClubDeZhouSCSettleNotify_CMD =11 [default = 11];     		//结算通知
	required int32 ClubDeZhouSCBackToLobbyReq_CMD =12 [default = 12];			//返回大厅请求
	
	required int32 ClubDeZhouSCPreOpReq_CMD =13 [default = 13]; 			    //预操作请求
	required int32 ClubDeZhouSCPreOpRsp_CMD =14 [default = 14];			    //预操作回复
	
	required int32 ClubDeZhouSCStanpUpReq_CMD	=15	[default = 15];				//站起请求
	required int32 ClubDeZhouSCSitDownReq_CMD =16	[default = 16];				//坐下请求
	
	required int32 ClubDeZhouSCTakeInRangeReq_CMD=17  [default = 17];		//筹码买入范围查看请求
	required int32 ClubDeZhouSCTakeInRangeRsp_CMD=18	[default = 18];		//筹码买入范围查看回复
	required int32 ClubDeZhouSCTakeInReq_CMD	=19	[default = 19];			//筹码买入请求
	required int32 ClubDeZhouSCTakeInRsp_CMD   =20    [default = 20];		//筹码买入回复
	
	required int32 ClubDeZhouSCFailNotify_CMD =21		[default = 21];		//异常提示通知
	
	required int32 ClubDeZhouSCTableResetNotify_CMD=22 [default = 22];	//桌子重置通知(发生在结算一断时间后)
	required int32 ClubDeZhouSCCancelAutoReq_CMD=23    [default = 23];	//取消托管请求
	required int32 ClubDeZhouSCCancelAutoNotify_CMD=24 [default = 24];	//有玩家取消托管通知
	
	required int32 ClubDeZhouSCGmReq_CMD =25			 [default = 25];	//Gm命令请求
	required int32 ClubDeZhouSCShowCardNotify_CMD =26		[default = 26];	//有玩家亮牌通知
	
	required int32 ClubDeZhouSCRecordReq_CMD =27			[default = 27]; //最近牌局记录查询 请求
	required int32 ClubDeZhouSCRecordRsp_CMD =28			[default = 28];	//最近牌局记录查询 回复
	required int32 ClubDeZhouSCRecordDetailReq_CMD =29	[default = 29]; //牌局记录详情查询 请求
	required int32 ClubDeZhouSCRecordDetailRsp_CMD =30	[default = 30]; //牌局记录详情查询 回复
	
	required int32 ClubDeZhouSCCofingReq_CMD =31			[default = 31]; ////房间设置 请求
	required int32 ClubDeZhouSCConfigNotify_CMD =32		[default = 32]; //房间设置成功 通知 
	
	required int32 ClubDeZhouSCKickUserReq_CMD =33		[default = 33]; //踢人请求 (给主播踢人用)
	
	required int32 ClubDeZhouSCGoldNotify_CMD =34			[default = 34]; //金币变化通知
	required int32 ClubDeZhouSCOnLineCntNotify_CMD =35    [default = 35]; //在线用户数变化通知
	
	required int32 ClubDeZhouSCChatReq_CMD =36			[default = 36]; //表情聊天请求
	required int32 ClubDeZhouSCChatNotify_CMD =37			[default = 37]; //表情聊天通知
	required int32 ClubDeZhouSCToStartNotify_CMD=38		[default = 38]; //开局倒计时通知
	
	required int32 ClubDeZhouSCKickUserRsp_CMD =39		[default = 39]; //踢人回复
	
	required int32 ClubDeZhouSCPauseReq_CMD =40			[default = 40]; //暂停设置 请求
	required int32 ClubDeZhouSCPauseRsp_CMD =41			[default = 41]; //暂停设置 返回
	required int32 ClubDeZhouSCBackToLobbyRsp_CMD =42 	[default = 42];	//返回大厅回复
	
	required int32 ClubDeZhouSCBalanceNotify_CMD=43		[default = 43];	//有玩家筹码余额发生变化通知 (主播更改配置后可能发生)
	
	required int32 ClubDeZhouSCOverViewReq_CMD=44			[default = 44];	//牌桌总览请求
	required int32 ClubDeZhouSCOverViewRsp_CMD=45			[default = 45];	//牌桌总览返回
	
	required int32 ClubDeZhouSCTableStartReq_CMD =46		[default = 46];	//"开始牌局"请求 (房主使用)
	required int32 ClubDeZhouSCTableStartNotify_CMD =47	[default = 47]; //房主点击了"开始牌局" 通知
	
	required int32 ClubDeZhouSCAutoNextReq_CMD =48		[default = 48];	//"开始游戏" 请求 (房主使用)
	required int32 ClubDeZhouSCAutoNextNotify_CMD =49		[default = 49];	//房主点击了"开始游戏" 通知
	
	required int32 ClubDeZhouSCInsurNotify_CMD =50					[default = 50];		//进入保险阶段通知
	required int32 ClubDeZhouSCInsurDealNotify_CMD = 51				[default = 51];		//保险后发牌通知(同时表示最近保险阶段结束)
	required int32 ClubDeZhouSCInsurBuyReq_CMD =52					[default = 52];		//保险购买请求
	required int32 ClubDeZhouSCInsurBuyRsp_CMD =53					[default = 53];		//保险购买回复
	
	required int32 ClubDeZhouSCDelayReq_CMD =54 					[default = 54];		//延时请求
	required int32 ClubDeZhouSCDelayRsp_CMD =55 					[default = 55];		//延时回复
	required int32 ClubDeZhouSCDelayNotify_CMD =56 					[default = 56];		//有人延时成功通知
	
	required int32 ClubDeZhouSCHeadInfoReq_CMD=57					[default = 57];		//头像信息请求
	required int32 ClubDeZhouSCHeadInfoRsp_CMD=58					[default = 58];		//头像信息回复

	required int32 ClubDeZhouSCTakeOutRangeReq_CMD=59  				[default = 59];		//筹码带出范围查看请求
	required int32 ClubDeZhouSCTakeOutRangeRsp_CMD=60				[default = 60];		//筹码带出范围查看回复
	required int32 ClubDeZhouSCTakeOutReq_CMD=61					[default = 61];		//筹码带出请求
	required int32 ClubDeZhouSCTakeOutRsp_CMD=62 		   			[default = 62];		//筹码带出回复

	required int32 ClubDeZhouSCRetainReq_CMD=63 						[default = 63];		//'留座离桌'或'回到座位' 请求
	required int32 ClubDeZhouSCRetainRsp_CMD=64						[default = 64];		//'留座离桌'或'回到座位' 回复
	required int32 ClubDeZhouSCRetainNotify_CMD=65					[default = 65];		//'留座离桌'或'回到座位' 生效通知

	required int32 ClubDeZhouSCCardOpenReq_CMD=66						[default = 66];		//翻牌请求
	required int32 ClubDeZhouSCCardOpenRsp_CMD=67						[default = 67];		//翻牌回复
	
	required int32 SCElapsedStatusNotify_CMD=69						[default = 69];		//桌子计时状态变化 通知
	required int32 SCElapWarnNotify_CMD=70							[default = 70];		//桌子剩余时间 警告

	required int32 ClubDeZhouHashListReq_CMD=79			[default = 79]; //Hash列表请求
	required int32 ClubDeZhouHashListRsp_CMD=80			[default = 80];	//Hash列表请求 返回

	required int32 ClubDeZhouHashCardReq_CMD=81			[default = 81]; //Hash当前局牌序列请求
	required int32 ClubDeZhouHashCardRsp_CMD=82			[default = 82];	//Hash当前局牌序列请求 返回

	required int32 ClubDeZhouUserStaticRsp_CMD=83			[default = 83];	//结算统计数据下发

	required int32 ClubDeZhouSCTakeChipsOutReq_CMD=84			[default = 84]; //手动撤码
	required int32 ClubDeZhouSCTakeChipsOutRsp_CMD=85			[default = 85];	//手动撤码 返回

	required int32 ClubDeZhouSCTakeOutInfoReq_CMD=86			[default = 86]; //撤码查看请求
	required int32 ClubDeZhouSCTakeOutInfoRsp_CMD=87			[default = 87];	//撤码查看请求 返回

	required int32 ClubDeZhouSCTakeOutSetReq_CMD=88			[default = 88]; //撤码设置
	required int32 ClubDeZhouSCTakeOutSetRsp_CMD=89			[default = 89];	//撤码设置 返回

	required int32 ClubDeZhouSCTakeOutSetReq1_CMD=90			[default = 90]; //撤码设置

	required int32 ClubDeZhouSCInsureNotify_CMD =91 					[default = 91];		//保险成功通知

	required int32 ClubDeZhouSCHandCardReq_CMD=92			[default = 92];		//看手牌请求
	required int32 ClubDeZhouSCHandCardRsp_CMD=93			[default = 93];		//看手牌请求回复

	required int32 ClubDeZhouSCCutCardReq_CMD=94			[default = 94];		//切牌请求
	required int32 ClubDeZhouSCCutCardRsp_CMD=95			[default = 95];		//切牌请求回复

	required int32 ClubDeZhouSCCardOpNotify_CMD=96            [default = 96];	//广播操作

	required int32 ClubDeZhouSCTakeInNotify_CMD=97            [default = 97];	//广播筹码买入

	required int32 ClubDeZhouSCLeaveNotify_CMD=98        [default = 98];	//广播用户离开
	required int32 ClubDeZhouSCEnterNotify_CMD=99        [default = 99];	//广播用户进入
	required int32 ClubDeZhouSCRevenueNotify_CMD=100        [default = 100];	//广播用户强制离开处罚时的收益通知
}

//DZ 登陆请求 (进入游戏，需要先登陆)
message ClubDeZhouSCLogOnReq
{
	required int32 nUserId =1;
	required string sTableId =2 [default = ""];	//桌子ID  (当使用有效nRoomId登陆时，该字段无效,填空串"")
	optional bool isKeepStand=3;   				//是否保持站立状态 true:是 其它:否
	optional int32 nRoomId=4 [default = -1];	// 0:试玩场 1:新手场 2:初级场 3:中级场 4:高级场 其它:无效 
	optional int32 nIsChangeTable=5;			//是否为切换牌桌 1:是 其它:否 (1时，nRoomId字段也要填上)
	optional string nPass = 6;                  //密码
}
//DZ 登陆回复
message ClubDeZhouSCLogOnRsp
{
	required int32 nRlt=1;								//0:成功 22:已被管理员踢出 17:桌子不存在 16:其它游戏中有未完成牌局 15:当天试玩场次数已用尽 其它:错误码
	optional string strErr=2;							//错误描述 错误时有
	optional ClubDeZhouSCScence tScence=3;				//场景信息 
	optional string sTableId =4  [default = ""];		//自由匹配桌子ID: 登录从服请求游戏服开桌,用户进入牌桌
}

//盲注配置
message ClubDeZhouSCConfigItem
{
	required int32 nConfigId=1;			//配置id
	required double nSmallBlind=2;		//小盲
	required double nBigBlind=3;		//大盲
	required double nTakeInMin=4;		//最低带入
	required double nTakeInMax=5;		//最高带入
}

//桌子可选配置
message ClubDeZhouSCConfigOption
{
	repeated ClubDeZhouSCConfigItem arrConfig=1;	//可选的盲注配置
	repeated int32 arrCapacity=2;				//可选的人数配置
	optional int32 nConfigIdDefault=3;			//默认配置
	optional int32 nCapacityDefault=4;			//默认人数
	optional int32 nIntervalLevDefault=5;		//默认牌局间隔 1:短暂 2:适中 3:漫长
}

//房间设置 请求
message ClubDeZhouSCCofingReq
{
	required int32 nConfigId=1;		 //配置id
	required int32 nCapacity =2;	 //人数配置
	optional int32 nIntervalLev=3;  //牌局间隔 1:短暂 2:适中 3:漫长
}
//房间设置成功 通知 
message ClubDeZhouSCConfigNotify
{
	required ClubDeZhouSCConfigItem tConfigItem=1;	//盲注配置
	required int32 nCapacity =2;					//人数配置
}

message LeaveSCTableConfig{
	optional bool isOpen=1;	 
	optional double nWinThreshold=2;	
	optional int32 nLots=3;	
	optional double nPenaltyRatio=4;	
	optional double nUserRatio=5;	
	optional int32 nType=6;	
}

//桌子配置信息显示
message SCTableConfig{
	required string sTableName=1;	  //房间名称,不带<>符号
	required string sPaiJuId=2;		  //牌局编号
	required string sClubName=3;	  //俱乐部名称,不带[]符号
	required double nSmallBlind=4;	  //小盲
	required double nBigBlind=5;	  //大盲
	required bool  isForceBlind=6;    //是否强制盲注 true:是 false:否
	required bool  isOnlyPlayByIOS=7; //是否仅限IOS玩 true:是 fasle:否
	required bool  isGPSLimit=8;	  //是否开启GPS限制 true:是 fasle:否
	required bool  isIPLimit=9;		  //是否开启ip地址限制 true:是 fasle:否
	required int32 nPoolEntryRate=10; //入池率限制,取值范围0~100; 0: 表示不限制
	required bool isDelayLook=11;	  //是否延迟看牌 true:是 fasle:否
	required int32 nInsureMode=12;	  //保险模式 0:无保险 1:传统保险 2:低水保险
	required double nPreAnte=13;	  //前注     0:表示没有
	optional bool isAOF=14;			  //是否仅能全下或弃牌;true:是, 其它:否
	optional int32 nPlayerAtLeast=15; //自动开始人数 (实际人数>=2且<该值时,显示"开始游戏")
	optional bool isTabkeOut=16;	  //是否带出筹码;true:是, 其它:否
	optional bool isDPreAnte=17;	  //庄家是否2倍前注
	optional int32 nEnterMin=18;	  //最小进入
	optional int32 nInsureNType = 19;
    repeated double arrOdds = 20;
    optional double nZhuaTou = 21;
	optional double nBuyMin = 22;   //最低买入
	optional int32 nTabkeOutOdd=23;	  //撤码阙值倍数N
	optional double nBuyMax = 24;
	optional int32 nIsPerson = 25;
	optional int32 nIsShow = 26;
	optional string sPassWord = 27;
	optional string nTableCost = 28;     //消耗配置 付费看公牌1 付费看手牌2 付费切牌3
	optional bool isVideoFee = 29;       //是否开启语音收费
	optional int32 preAnteOdd = 30;      //庄家几倍前注
	optional int32 nPoolHands = 31;      //手数限制
	optional double nLoseMaxAmount = 32;         //输钱限制金额
	optional double nVideoFee = 33;         //语音金额
	optional double nTakeInLimit = 34;      //补码上限
	optional int32 nPoolEntryRateHands = 35;      //入池率多少手不限制
	optional LeaveSCTableConfig tLeaveTableConfig = 36;
}

message ChatItem{
	required int32 nChatId=1;	//表情id
	required double nCost=2;	//表情价格(金币)
}

message WinRate{
	required int32 nPos=1;				//座位号
	required double nWinRate=2;			//胜率 (值100即为100%, <=0:无意义)
}

// 底池玩家对应下注
message PotUser {
	required int32 nUserId=1;	//玩家
	required double nBet=2;	    //下注
	required int32 nPoolId=3;	    //底池Id
}

//场景信息
message ClubDeZhouSCScence
{
	required double nSmallBlind=1;				//小盲注数额
	required double nBigBlind=2;				//大盲注数额(通常等于:小盲注x2)
	required int32 nCapacity=3;					//桌子座位数(6或9)
	required int32 nOperateTime=4;				//操作最大时间,单位:秒 (通常为10)
	required double nPotSum =5;					//底池总额(已押筹码总额)
	repeated double arrPot =6;					//已收归的各底池数额(池数量:>=0)
	repeated int32 arrCommunityCards=7;			//公共牌(最多5个牌)
	repeated ClubDeZhouSCUser arrUsers=8;			//座位上的玩家
	required int32 nStage =9;						//当前游戏状态 0:未开始(等待游戏开始) 1:游戏中 2:结算阶段
	optional ClubDeZhouSCOperation tOperation=10;		//当前自己可操作信息(自己为思考状态时有)
	optional ClubDeZhouSCPreOpOption tPreOpOption=11; //自己当前可预操作选项
	optional bool isConfigNotSet =12;					 	//本桌子是否需要配置后才能开始 true:是 其它:否
	optional ClubDeZhouSCConfigOption tDeZhouConfigOption=13;  //桌子可选配置(主播有)
	optional int32 nLiveUserId =14;						 	//房主Id
	optional double nGold =15;							 	//当前可用币数
	optional int32 nMSeconds =16;						 	// >0:开局倒计时剩余时间(毫秒) -1:等待状态(因为主播设置了暂停) 其它:无意义
	optional bool isPause =17;							 	//当前桌子暂停状态(主播有用) true:已设置为暂停 其它:非暂停
	optional int32 nRoomId=18 [default = -1];				// 0:试玩场 1:新手场 2:初级场 3:中级场 4:高级场 其它:无效
	optional int32 nClubId=19;								//>0:俱乐部id
	optional string sTableName=20;							//桌子名称
	optional int32 nCurrency=21;							//本桌子使用的币种 1:金币 >1:俱乐部币
	optional bool isCanCloseTable=22;						//是否有桌子管理权限 true:是, false:否
	optional bool isTableStart=23;	   						//牌桌是否开始 true:是, false:否(管理者需点击"开始牌局"才能开始)
	optional bool isAutoNext=24;							//下局是否自动开始 true:是 (废弃字段)
	optional int32 nPauseRemain=25;							// >0:正在暂停倒计时(秒); 其他:无意义
	optional SCTableConfig tTableConfig=26;					//桌子配置信息
	repeated SCInsurPanelData tInsurPanelData=27;				//保险面板数据(非保险阶段时,字段不存在)
	optional int32 nTableType=28;							//桌子类型 10:大厅桌子 11:俱乐部桌子 其它:未定义
	repeated ChatItem arrChat=29;							//表情价格列表 
	repeated int32 arrCombinedCards=30; 					//能组成最大牌型的5个牌
	repeated WinRate arrWinRate=31;							//玩家胜率
	optional int32 nElapsedStatus =32;						//桌子当前计时状态 0正常计时中 1暂停计时中
	optional double nZhuaTou = 33;
    optional double nPreAnte = 34;
	optional int32 nKeepTime = 35;
	repeated PotUser potUsers =36;					       //已收归的各底池玩家对应信息
	optional double nLoseAmount = 37;        // 用户在桌子中的盈利信息
	optional int32 nPlayCnt = 38;        // 用户在桌子中的手数信息
}

//玩家信息
message ClubDeZhouSCUser
{
	required int32 nUserId=1;			 //玩家ID
	required int32 nSitId=2;			 //座位号
	required string sFaceId=3;			 //头像url
	required string sName=4;			 //昵称
	required int32 nSex=5;	    		 //性别 0:男 1:女
	required double nBalance=6;			 //余额
	required bool isBanker=7;			 //是否为庄; true:是 ,false:否
	repeated int32 arrHoleCards=8;		 //底牌(值为0的牌，显示牌背,表示还没亮牌)
	required int32 nCardType=9;			 //牌型(见本文件头部"牌型定义")
	required double nBet =10;			 //玩家当轮当前下注数目(0时不要显示)
	required int32 nStatus=11;		 	 //当前玩家状态, 0:等待操作权中 1:思考中 2:跟注 3:看牌 4:加注 5:AllIn 6:弃牌 7:旁观 
	optional int32 nOpTimeRemain=12;	 //剩余可操作(思考)时间 (思考中时有效,其它情况时为0)
	optional bool isAuto=13;			 //是否托管中
	optional string sShopAcc = 14;		//第三方用户ID
	optional bool isAndroid = 15;		//第三方用户ID
	optional int32 nDelay=16;			//是否有延时,0:没延时 >0:延时后的总时间
	optional int32 nRetain=17;			//>0:留座离桌剩余时间(秒) ,其它:无效 
	optional double nWinRate=18;		//胜率(值100即为100%, <=0:无意义)
	optional int32 nPlayCnt=19;			// 玩牌次数
	optional double nTotalWinGold=20;		// 总输赢
}

//可预操作的选项
message ClubDeZhouSCPreOpOption
{
	message Option{
		required double nOpId =1; // -20:弃或过  -21:过牌 -22:跟任何注 >0:跟xx -23:结束后亮牌 -24:亮牌
		required bool isOn =2;	 //当前预操作按钮选中状态 true:选中 false:未选中
	}
	repeated Option arrOption=1;	
}

//操作权信息 (弃牌 跟注xx AllIn 看牌 加注)
message ClubDeZhouSCOperation
{
	message RaiseChoice{
		required double nMin=1;			//加注最小值
		required double nMax=2;			//加注最大值
		repeated int32 arrQuickRaise=3; //可快速操作的选项 -10:(1/2底池)  -11:(2/3底池) -12:(1个底池)  -13:(2个大盲) -14:(3个大盲)  -15:(4个大盲)  -1:(AllIn)
	}
	required int32 nOpA =1;	 			  //按钮1显示,只有一种状态   -5:弃牌
	required double nOpB =2;	 		  //按钮2显示,有三种可能状态 -1:AllIn, -2:看牌, >0:跟注xx
	required int32 nOpC =3;	 			  //按钮3显示,有三种可能状态 -1:AllIn, -3:加注 -4:加注(置灰)
	optional RaiseChoice tRaiseChoice =4; //可加注范围 (可加注时有效)
	optional double nDelayCost=5;			//延时花费, -1或nil:不能延时,0:免费 ,>0:金币数
	optional double nInsureDelayCost=6;		//保险延时花费, -1或nil:不能延时,0:免费 ,>0:金币数
}

//站起请求
message ClubDeZhouSCStanpUpReq
{
	optional int32 nNoUse=1;				//没用字段
}

//有玩家从座位上站起通知
message ClubDeZhouSCUserStanpUpNotify
{
	required int32 nSitId=1;				//站起玩家的座位号
}

//坐下请求 longitude and latitude
message ClubDeZhouSCSitDownReq
{
	message Gps{
		required double nLongitude=1;	//经度(范围:-180~180;负为西经,正为东经)
		required double nLatitude=2;	//纬度(范围:-90~90;负为南纬,正为北纬)
	}
	optional int32 nPos=1;				//>0:坐下的座位号. 0:随机坐下
	optional Gps tGps=2;				//经纬度坐标(gps很耗电,给n分钟内的值便可) (防伙牌功能开启时需要)
	optional string sIP=3;				//外网ip(例如:14.23.82.242;因为走代理,真实ip前端传下)  (防伙牌功能开启时需要)
}

//有玩家坐下通知
message ClubDeZhouSCUserSitDownNotify
{
